aid: kriya
name: Kriya
description: 'Kriya (Kriya Finance Limited, London) is a UK B2B embedded-finance and
  working-capital provider that lets merchants offer trade credit to their business
  buyers. Its products span Embedded PayLater (B2B buy-now-pay-later terms at checkout),
  Invoice Finance, working capital loans, buyer authentication, offline payments and
  a Kriya-on-Stripe integration. Kriya publishes two partner-facing REST APIs — the
  Payments API for buyer registration, risk decisioning, order lifecycle and payment
  deductions, and the Onboarding API for automating company and KYC checks — alongside
  a hosted Payments Journey and Onboarding Journey web flow, HMAC-signed webhooks,
  a dedicated test environment with scenario simulators, and e-commerce plugins for
  BigCommerce, Magento, nopCommerce, PrestaShop and Salesforce. Kriya was acquired
  by Allica Bank in October 2025.'
