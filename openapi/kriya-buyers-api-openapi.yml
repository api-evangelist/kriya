openapi: 3.2.0
info:
  title: Kriya Payments Buyers API
  description: "<a name=\"introduction\"></a>\n# Introduction\nWelcome to Kriya Payments API, the platform that allows partners to offer a Buy Now Pay Later (BNPL) payment scheme to their business customers.\n\n>Access to the API is restricted to select partners, and those with access will have received the relevant credentials.\n\nDevelopers can use this documentation to understand how to implement the BNPL scheme.\n\nWant to learn more about Kriya Payments? You can either request a demo [here](https://kriya.co/embeddedfinance) or contact us at <payments@kriya.co>.\n\n## Cross-Origin Resource Sharing\n\nThis API features Cross-Origin Resource Sharing (CORS) implemented in compliance with W3C spec. And that allows cross-domain communication from the browser. Furthermore, all responses have a wildcard same-origin, making them wholly public and accessible to everyone, including any code on any site.\n\n## Authorization\n\nOnce approved to use the API, you will have access to your API keys that you must send using the header `X-Kriya-ApiKey` with every request.\n\nRequests and responses must use [JSON](https://www.json.org/).\n\nAll API requests must be sent over HTTPS.\n\n<a name=\"rate-limiting\"></a>\n## Rate Limiting\n\nThe API limits the number of requests that can be made. This approach ensures we can continue to have a reliable API for partners to consume.\n\nRequests are measured over a specified period per API key. The current limitations are that no more than 2000 requests can be made to the API every 5 minutes across the majority of the endpoints (except on the Search endpoint that has a limitation of 5 requests per second). If the limit is breached, the API will begin to respond with `429 Too Many Requests` until the time interval has been refreshed.\n\nIf limits are consistently breached on the API, we may temporarily disable your access to the API and inform you of this.\n\n## Response Status Codes\n\nAPI requests made to Kriya Payments endpoints may return several different HTTP status codes.\n\n| Status Code               | Description                                                                                                                                                                                                                                                             |\n|---------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| 200 OK                    | The request was received and successfully processed by Kriya Payments.                                                                                                                                                                                                  |\n| 201 Created               | The request was received and successfully processed, and a new resource was created.                                                                                                                                                                                    |\n| 400 Bad Request           | The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.                                                                                                            |\n| 401 Unauthorized          | The `X-Kriya-ApiKey` header was not present or is invalid.                                                                                                                                                                                                              |\n| 404 Not Found             | The requested resource could not be found.                                                                                                                                                                                                                              |\n| 429 Too Many Requests     | The application has exceeded the rate limit. See [Rate Limiting](#rate-limiting).                                                                                                                                                                                       |\n| 500 Internal Server Error | An unexpected internal error has occurred. Please get in touch with us at <apisupport@kriya.co> so that we can investigate further.                                                                                                                                     |\n| 503 Service Unavailable   | The server is currently unavailable and cannot accept requests. We will inform Merchants of any planned downtime or outages. If you have not received any communication and you have received this response code, please get in touch with us at <apisupport@kriya.co>. |\n\n<a name=\"definitions\"></a>\n# Definitions\n\n**Merchant**:  The Merchant is the partner that will integrate with the Kriya Payments API. This is typically an online platform that provides goods or services to Buyers, either directly or via Suppliers.\n\n**Buyer**: A Buyer is a business that is purchasing goods or services from the Merchant. A Buyer must be registered on Kriya Payments API and be given an approved spending limit before being able to transact with us.\n\n**Supplier**: A Supplier is a business that provides goods or services to be sold via the Merchant. The Supplier must be registered and approved on Kriya Payments API before the Merchant sells goods or services on their behalf. A Supplier may also be a Buyer on either the same or other Merchants.\n\n**Order**: An order is an agreement between the Buyer, Supplier, and the Merchant of buying goods and services. The value of the order may be the sum of one or many goods or services. An individual order can be purchased via the BNPL options provided to Buyers.\n\n**Buyer Spending Limit**: The spending limit is the total amount that Kriya Payments can offer a Buyer to transact with. Kriya Payments continually monitors the spending limits assigned to Buyers and may increase or decrease them.\n\n**Buyer Available Spending Limit**: The available spending limit is the amount that the Buyer can use to transact using Kriya Payments. Whenever an order progresses beyond the `Draft` status, the total amount of the order is deducted from the available spending limit. All orders made must fall within the available spending limit for the Buyer.\n\n**Merchant Spending Limit**:  This is the total amount that Kriya Payments can offer to fund orders placed by any buyers with the merchant. Kriya Payments monitors the spending limits assigned to Buyers and may increase or decrease them.\n\n**Merchant Available Spending Limit**: This is the amount the merchant can use to receive advance funding from Kriya Payments for buyers’ orders. The advance rate value of the order is deducted from the available funding limit when an order progresses beyond the `Draft` status.\n\n**Kriya Payments Fee**: Orders created may be paid for from several payment methods, e.g. \"Pay in 30 days\". Each payment method may include a fee that is payable by the Buyer that is based on a percentage of the order amount. When the Buyers available spending limit is reduced, it is exclusive of fees. For example, a Buyer may want to pay for a £1,000 order using a payment method that has a 1.00% fee. The total amount payable by the Buyer would be £1,010, and their available spending limit is reduced by £1,000.\n\n**Payment Method**: A payment method is a specific term under which an order is to be paid. For example, \"Pay in 30 days\" or \"Pay in 3 instalments\". Each Merchant and Buyer can have different methods provided to them at the checkout stage. Fees associated with payment methods can be set globally or overridden for specific Buyers.\n\n**Additional Onboarding Checks**: Additional AML checks requested by merchant. You can find more information [here](https://docs.kriya.co/onboarding#section/Definitions).\n\n**2FA**: Two-factor authentication (2FA) is a security process in which users provide two different authentication factors to verify themselves. Kriya will verify the user's phone number. \n\n**Buyer user admin**: An employee of a buyer who can manage buyer users and place orders on behalf of the buyer company. \n\n**Buyer user**: An employee of the buyer who can place orders on behalf of the buyer company. \n\n# Additional Security Levels Provided by Kriya\nDefault checks that are required by Kriya - Risk checks for Sole Traders and Limited Companies. They are always presented and can not be elevated. \n\n- Additional layers of security may be added by Merchant request. They include:\n- Additional onboarding checks that may include any combinations of the following:  \n  - Selfie Check\n  - Identity Verification and Proof of Address\n  - Sanction Screening\n  \n  For Limited Company the checks should be completed by registered director. Sole Trader can undergo the process by themselves. Until their successful completion the order placement (except draft ones) for this Limited Company will be blocked. There is a limitations for Limited Company checks: right now Kriya can perform them only for UK based companies.\n- 2FA \n  \n  2FA involves two types of roles: `buyer user admin` and `buyer user` (please check [definitions](#definitions) for more details). Kriya considers users who passed additional onboarding check as user admin. They can approve orders and reach out to support. Kriya considers users who initiated successful onboarding process and successfully submitted an order as a 'regular user'. They can create new orders without approval from admins. 2FA pause submission or the modification of submitted orders until approval is received.   \n  \n<a name=\"integration-scenarios\"></a>\n# Integration Scenarios\n\nThe Kriya Payments API provides a variety of methods of integration for partners. This includes direct API integration and a Kriya Payments-hosted Payments Journey web application.\n\nThe following table outlines the differences in scenarios:\n\n| Property                 | Direct API                                                                                                                                                              | Payments Journey                                                                                                                                                                                                                            |\n|--------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Effort                   | The estimated effort of between 1-4 weeks to implement. The developer effort is more significant as it involves a bespoke integration built by the Merchant.            | The estimated effort of around one week to implement. Lower development effort as the majority of the integration is handled by the Kriya Payments Payments Journey with only minimal API integration required by the Merchant.             |\n| Limitations              | Currently Direct Api doesn't support sole trader creation.                                                                                                              |                                                                                                                                                                                                                                             |\n| Checkout data collection | Additional fields, if not currently exposed, may be required to create a Kriya Payments order that the Merchant must embed in their checkouts.                          | Kriya Payments collects Company and User details on your behalf. Returning Buyers also have their previous data pre-populated to increase the speed of the checkout process.                                                                |\n| Branding                 | The integration will be built by the Merchant, and any branding can be fully controlled.                                                                                | Co-branding is limited to displaying the Merchant logo, but further enhancements are on the roadmap.                                                                                                                                        |\n| User experience          | The Merchant must define its UX and UI for its Buyers that align with the [API flows](#direct-api-integration). Users stay within the  domain of the Merchant website.  |  User experience is pre-defined by Kriya Payments and optimised based on regularly reviewed metrics collected from customers that use the Payment Journey. Users must be redirected to an external site to continue their checkout journey. |\n| API Updates              | Changes to Kriya Payments API, including any new capabilities, will have to be developed by the Merchant.                                                               | Payments Journey will constantly be kept up to date with the latest API capabilities to ensure the customer has a high-quality experience.                                                                                                  |\n\n<a name=\"direct-api-integration\"></a>\n## Direct API Integration\n\nDirect API integration is the preferred choice for partners that want to have significant control over the customer journey and embed the capabilities of the API directly into their solutions. However, not all scenarios are covered end-to-end by direct API, some of them require a mixed approach with direct API and [Onboarding Journey web application](https://docs.kriya.co/onboarding#section/Onboarding-Journey-Integration). \n\n### Direct API flow\n\nThe following flow demonstrates the only end-to-end scenario that is covering a sequence for a new Limited Company Buyer transacting using the API when Merchant does not require additional onboarding checks:\n\n1. **Buyer** has been searched on the Kriya Payments API `Search` endpoint and chosen from the list.\n2. **Buyer** has been onboarded by the Merchant.\n3. **Merchant** requests to the Kriya Payments API `CreateBuyer` endpoint to register them on the API to identify if they can use Kriya Payments.\n4. **Kriya Payments API** begins the risk decision process to determine if a limit can be provided to the Buyer.\n5. **Kriya Payments API** responds with a `201 Created` status code to confirm the Buyer has been created.\n>Note: Merchants may create `Draft` orders whilst awaiting a risk decision. However, no orders can be `Submitted` until the Buyer has been `Approved`. See [Webhooks](#webhooks) for more details on how to get notified of this.\n6. **Merchant** uses [webhooks](#webhooks) or the `GetBuyer` endpoint to determine whether the Buyer has been `Approved` and Kriya payment methods are available to them.\n7. **Merchant** may call the Kriya Payments API `GetBuyerPricingScheme` endpoint to understand which payment methods are available to the Buyer, along with any associated fees they may incur.\n8. **Kriya Payments API** responds with a `200 OK` response and provides the pricing scheme available to the Buyer.\n9. **Buyer** uses the Merchant to purchase services or goods and chooses to pay with Kriya Payments, presuming the Merchant has exposed the ability to check out using Kriya Payments.\n10. **Merchant** calls the Kriya Payments API `CreateOrder` endpoint, which will create a new order in the default `Draft` status.\n> A `Draft` order is non-committal and can be cancelled at any time. It does not impact the available spending limit of the Buyer.\n11. **Kriya Payments API** responds with a `201 Created` to confirm the order has been created and also returns details about the Buyer's possible payment methods and limit.\n12. **Buyer** confirms they want to proceed and place the order on the Merchant.\n13. **Merchant** calls the Kriya Payments API `TransitionOrder` endpoint and moves it from the `Draft` status to `Submitted`. If the Merchant requires additional onboarding checks before any company order placement, the response will depend on whether any of the company's directors have passed them. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.\n> By transitioning the order to a `Submitted` status, the Buyers available spending limit is reduced based on the total amount of the order.\n14. **Kriya Payments API** responds with a `200 OK` response.\n15. **Merchant** delivers the goods to the Buyer, and an invoice has been generated.\n16.  **Merchant** requests to the Kriya Payments API `TransitionOrder` endpoint and moves it from `Submitted` status to `ReadyToAdvance`.\n> This is the trigger from the Merchant to inform Kriya Payments to advance funds to the Merchant and Supplier if applicable. No further changes can be made to the order at this point.\n17. **Kriya Payments API** responds with a `200 OK` response.\n\n![API Integration Flow](https://cdn.kriya.co/images/KriyaPaymentsAPI-API-Integration-Sequence-Flow.png)\n\n<details>\n<summary> <b>Company Search</b> </summary>\nKriyaCompanyIdentifier is mandatory when you want to onboard buyers/suppliers to get an instant decisioning for them.</br>\nTo get it Company search must be used.\n\nPlease feel free to use the following code to test search functionality: \n```\n    const url = 'https://api.kriya.dev/payments/companies/search'; \n    const headers = {\n        'Content-Type': 'application/json',\n        'X-Kriya-ApiKey': '<please replace with your api key>'\n    }\n    const data = {\n        address: {\n            country: 'GB'\n        },\n        name: 'Apple'\n    }\n    \n    axios.post(url, data, {headers: headers})\n    .then(function (response) {\n        console.log(response.data);\n    })\n    .catch(function (error) {\n        console.error('Request failed:', error);\n    });\n    \n```\nThere are many ways to search for companies depending on the company data at hand. However, we strongly recommend prioritising searches using NationalIds, as they have a higher probability of providing exact matches, rather than lists of probable companies.\nA NationalId is a unique identifier of a company provided by its country of registration: for example, for the UK it is the Company Registration Number (CRN), while for Italy can be either \"Chamber of Commerce Number\", \"Value Added Tax Number\" or \"Fiscal Code\".\nOther searches should only be relied on in case of search failure (0 matches) using NationalIds.\n\nThe following combinations tend to favour exact matches, in order of precision:\n* CountryCode + NationalId (typically returns a single match)\n* URL or email (depends on the availability of the info in the database)\n\nThe other type of search is via Name + Address (partial match), which usually retrieves a list of companies.\n\nThe United States and Canada do not have a nationwide NationalId database to uniquely identify companies. For this reason, the only way to successfully search for a company is using Name + Address or URL/email search.\nNOTE: The resulting list of companies contains only the following:\n* Stand-alone companies.\n* Headquarters.\n* Subsidiaries.\nIn other words, if the search is for a company with branches, you won’t find any branches but only headquarters.\n\n![Limited Company Search Flow](https://cdn.kriya.co/images/KriyaPaymentsAPI-LimitedCompany-Search-Sequence-Flow.png)\nExample of a response payload\n```json\n{\n  \"kriyaCompanyIdentifier\": \"31c421ca-ec6e-44fa-a78d-9fe6e841c580\",\n  \"name\": \"string\",\n  \"nationalId\": \"string\",\n  \"address\": {\n    \"addressLine1\": \"string\",\n    \"addressLine2\": \"string\",\n    \"city\": \"string\",\n    \"region\": \"string\",\n    \"postCode\": \"string\",\n    \"country\": \"string\"\n  },\n  \"website\": \"string\",\n  \"email\": \"string\"\n}\n```\n</details>\n\n### Scenarios that require mixed approach (direct API + Onboarding Journey web application) \n- **Buyer is a Sole Trader who has not been onboarded to Kriya yet and who wants to transact**\n\n  Above sequence will be changed in the following way: \n  - Step [1-5] will be replaced by Sole Trader Onboarding Journey. More information about this can be found [here](https://docs.kriya.co/onboarding#section/Onboarding-Journey-Integration/Sole-Trader-Onboarding).\n  - Step [6]: Merchant still can use [webhooks](#webhooks) or `GetBuyer` to determine whether the Buyer has been `Approved`.   \n\n\n- **Merchant requires additional onboarding checks and Buyer does not have any director who has been undergone them**\n  \n  Above sequence \n  - should be interrupted after Step [12] \n  - should have additional step for the director to pass additional onboarding checks. More detailed information can be found [here](https://docs.kriya.co/onboarding).\n  - should be resumed from Step[13] after Merchant by means of [webhooks](#webhooks) endpoint receive information about successful Onboarding checks completion.\n\n\n- **Merchant requires 2FA approval for order placement and order is being placed by a user who has not submitted any order or initiated additional onboarding checks**\n  \n   Above sequence will be changed in the following way:\n   - Step[13] return a SessionStatusUrl that can be used for tracking of 2FA progress and clarification message that includes information about approvers.\n   - Approval process that was initiated in Step [13] has the following steps:\n     - **Kriya Payments API** initiates 2FA Session. Part of this process is gathering information about buyer user admins (see [definitions](#definitions) for more details)  and sending out SMS with the link to Payment Journey page where they can approve the operation. Session expiration time is 5 minutes. If decision has not been received by Kriya within this timeframe operation considered as abandoned and request should be resent again.\n     - **Buyer User Admin** open a received in SMS link to Payment Journey and approve or reject the operation\n     - **Payment Journey** passes the decision to Kriya Payments API\n     - **Kriya Payments API** completes the session and resume or abandon the operation based on the received decision.\n     - **Merchant** can use [webhooks](#webhooks) to track the positive outcome of the 2FA flow or use `GetOrderMfaSession` endpoint to track all possible outcomes\n  \n   <img style=\"margin: 20px 50px\" src=\"https://cdn.kriya.co/images/2FA-Flow.png\" alt=\"2FA Flow\"/>\n   \n   - the sequence resumes from Step [15]\n\n<a name=\"payments-journey-integration\"></a>\n## Payments Journey Integration\n\nThe Payments Journey-driven integration utilises a Kriya Payments-hosted web application that handles the checkout journey for customers. Additionally, Payment Journey seamlessly handle over control to Onboarding Journey to cover scenarios related to buyer's onboarding and company checks. This is the preferred approach for partners that are looking for a lower-effort solution that unlocks the full functionality provided by Kriya.\n\n### Payments Journey Demonstration\n\nThe following file shows a walk-through of an end-to-end journey from the customer's perspective once they have been redirected to the Kriya Payments hosted Payments Journey.\n\n\n![Payments Journey Walkthrough](https://cdn.kriya.co/images/KriyaPaymentsApi-PaymentsJourney-Walkthrough_New.gif)\n\n### Payments Journey flow\n\nThe following flow shows a typical scenario for the Payments Journey. A Limited Company Buyer has chosen to pay using Kriya Payments on the Merchant that does not require any additional checks, and they will complete their checkout process via the Payments Journey before being redirected back to the Merchant.\n\n1. **Buyer**, existing or new, has been onboarded by the Merchant and has been offered Kriya Payments.\n2. **Merchant** calls the Kriya Payments API `CreateOrder` endpoint, which will create a new order in the default `Draft` status.\n> To initiate a payment journey additional fields are required. See, `Initiating a payment journey` below.\n3. **Kriya Payments API** responds with a `201 Created` status code to confirm it has been created and also returns a redirect URL, which is valid for 14 days.\n> The redirect URL is used to redirect the customer to the Kriya Payments-hosted Payments Journey.\n4. **Merchant** redirects the customer to the returned URL.\n5. **Buyer** lands on the Payments Journey page, which includes filling out Company and User details if they were not initially provided in step 2.\n6. **Buyer** selects their preferred payment method and finally completes their payment journey.\n7. **Payments Journey** redirects the Buyer back to the Merchant.\n8. **Buyer** places the order on the Merchant.\n> If your checkout process does not require the Buyer to confirm the placement of the order, you can use our `AutoTransitionOnCompletion` field, which automatically performs step 9 for you. See below for further details.\n9. **Merchant** calls the Kriya Payments API `TransitionOrder` endpoint and moves it from `Draft` to `Submitted`. If the Merchant requires any additional onboarding checks before any company order placement, the response will depend on whether any of the company's directors have passed them. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.\n> By transitioning the order to the `Submitted` status, the Buyer's available spending limit is reduced based on the total amount of the order.\n10. **Kriya Payments API** responds with a `200 OK` response to confirm that the order has been submitted.\n> At this point, the same steps from 11 onwards in the `API flow` are now followed.\n\n![Payments Journey flow](https://cdn.kriya.co/images/KriyaPaymentsAPI-PaymentsJourney-Sequence-Flow.png)\n\n        \nAll scenarios where Payment Journey handle over control to Onboarding Journey can be found [here](https://docs.kriya.co/onboarding#section/Onboarding-Journey-Integration/Payment-Journey-and-Onboarding-Journey-integration). They are related for the cases when buyer's onboarding or company checks are required.\n\n### Payments Journey flow with 2FA\nThe following flow shows a typical scenario when Merchant is requesting 2FA and a Limited Company Buyer has chosen to pay using Kriya Payments.\n\n![Payments Journey flow](https://cdn.kriya.co/images/KriyaPaymentsApi-PaymentsJourney-Walkthrough_2FA.gif)\n\n**AutoTransitionOnCompletion**\n\nThis property defines the status that the order will transition to after the payment journey is completed but before redirecting them back to the Merchant. By default, any payment journey completion will leave an order in its `Draft` status. However, this property allows you to transition an order to `Submitted` or `ReadyToAdvance` instead automatically.\n\n### Initiating a Payment Journey\n\nTwo properties must be specified to ensure you receive a redirect URL to the Payments Journey:\n\n**PaymentAcceptedRedirectUrl**\n\nThis refers to the URL that we will redirect the Buyer to once they have completed the Payments Journey. Upon redirection, you will now have an order that has been created, still in the `Draft` status, unless the `AutoTransitionOnCompletion` property has been set.\n\n**PaymentDeclinedRedirectUrl**\n\nThis refers to the URL that we will redirect the Buyer to if, at any point in the journey, they either do not wish to proceed or cannot proceed. Upon redirection, you will still have an order that has been created, still in the `Draft` status, which can be set to `Cancelled` if applicable. You will be able to retrieve the details about why the Payments Journey has been declined by retrieving the order details via the Kriya Payments API `GetOrder` endpoint, which will include a `PaymentJourney.Status` property that will be either:\n\n- **UserInitiated** - The user decided to return to the Merchant and no longer proceed with the order at this time. e.g. They may wish to add additional items to their basket or choose an alternative payment method. The Merchant can amend the order amount (`PUT` on the orders endpoint) and redirect the Buyer back to the payments journey, if applicable.\n- **Ineligible** - Kriya Payments were unable to transact with the Buyer as they have not been or are no longer approved. The Merchant is expected to provide the Buyer with an alternative payment method.\n- **InsufficientFunds** - Kriya Payments were unable to transact with the Buyer as their available spending limit is less than the amount of the current order. The Merchant is expected to either provide the Buyer with an alternative payment method or provide partial payment so that Kriya can still transact with the funds available on the Buyer's available spending limit.\n- **OnboardingChecksAreRequired** - Kriya Payments couldn't process the transaction with the Buyer due to the failure of the Merchant's requirement for one of its directors to complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.\n- **OnboardingChecksAreFailed** - Kriya Payments couldn't process the transaction with the Buyer due to the failure of the Merchant's requirement for one of its directors to successfully complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.\n- **InsufficientFundsOnboardingChecksAreRequired** - Kriya Payments were unable to transact with the Buyer as their available spending limit is less than the amount of the current order and due to the failure of the Merchant's requirement for one of its directors to complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.\n\n**Configuration**\n\nThe configuration of this feature is completed as part of the onboarding process as a Merchant to provide the initial setting. If this needs to be changed, please contact your Kriya account manager.\n\n## BigCommerce\n\nKriya Payments is now available for BigCommerce merchant stores. In addition, it can be downloaded for free directly from the [BigCommerce App Marketplace](https://www.bigcommerce.co.uk/apps/kriya-payments/).\n\n### Configuring the app\n\n1. Follow the link to the [BigCommerce App Marketplace](https://www.bigcommerce.co.uk/apps/kriya-payments/) and select `GET THIS APP`.\n2. Sign in to your BigCommerce store when prompted if you still need to do so.\n3. Select `Install`.\n4. Review the permissions that the app requires, check the compliance box and select `Confirm`.\n\n![BigCommerce App Permissions](https://cdn.kriya.co/images/KriyaPaymentsApi-BigCommerce-Permissions-Plugin.png)\n\nAt this point, the app has now been installed. To configure the app for your store, you need to link your BigCommerce store to your Kriya account:\n\n1. Enter your `Merchant Id` and `Secret Key` that you should have received from Kriya.\n2. Select `Continue`.\n\n![BigCommerce Link App](https://cdn.kriya.co/images/KriyaPaymentsApi-BigCommerce-Install-Plugin.png)\n\nOnce the app has been linked to Kriya, it is ready to be enabled to appear on the stores checkout page.\nThe app allows for it to be used for a subset of users against our `Test` environment before deploying it to your live store for all customers. \nThe app is in the `Test` mode when installed by default. To show the `Kriya Payments` option to specific users whilst in `Test` mode, you need to enter the e-mail address of a registered user into the appropriate field and select `ADD USER`.\nOnly these users will be able to see and use the app.\n<br/>\n\nOnce you're ready to show the `Kriya Payments` payment option to all of your customers on the live store, you need to switch the toggle from `Test` to `Production`.\n\n![BigCommerce Configure App](https://cdn.kriya.co/images/KriyaPaymentsApi-BigCommerce-Configure-Plugin.png)\n\nThe plugin will now be active, and the Kriya payment method will be available on the store checkout.\n\n![BigCommerce Checkout App](https://cdn.kriya.co/images/KriyaPaymentsApi-BigCommerce-Checkout-Plugin.png)\n\n## Magento (Adobe Commerce)\n\nKriya Payments is now readily available for Magento merchant stores. In addition, it can be downloaded for free directly from the [Magento Marketplace](https://marketplace.magento.com/kriya-payments.html).\n\nKriya Payments is supported with Magento CE 2.4.2 and above and Magento EE / Cloud 2.4 and above.\n\n### Installing the extension\n\n1. Follow the link to the [Magento Marketplace](https://marketplace.magento.com/kriya-payments.html) and add the extension to your cart.\n2. Follow the steps to complete the purchase. No payment details are required.\n3. Sign in to your Magento store when prompted if you still need to do so.\n4. Once the checkout is completed, select `Install`.\n5. You will then be provided details from Magento on how to install the extension.\n\n![Magento Install Extension](https://cdn.kriya.co/images/KriyaPaymentsApi-Magento-Install-Plugin.png)\n\nAt this point, the extension has now been installed. To configure the extension for your store, you should:\n\n1. Log into the admin panel of your Magento store.\n2. Select `Stores > Configuration > Sales > Payment Methods`.\n3. Identify the `Kriya Finance` option in the list and configure the options for the extension:\n   1. `Enable Test Mode` -> `Yes` if you wish to use the extension in test mode prior to going live.\n   2. `API Key` -> Enter your API key that you should have received from Kriya. The API key will be different based on whether you have enabled `Test Mode`.\n4. Select `Save Config`.\n\n![Magento Configure Extension](https://cdn.kriya.co/images/KriyaPaymentsApi-Magento-Configure-Plugin.png)\n\nThe extension will now be active, and the Kriya payment method will be available on the store checkout.\n\n![Magento Checkout Extension](https://cdn.kriya.co/images/KriyaPaymentsApi-Magento-Checkout-Plugin.png)\n\n## nopCommerce\n\nKriya Payments is now readily available for nopCommerce merchant stores. In addition, it can be downloaded for free directly from the [nopCommerce Marketplace](https://www.nopcommerce.com/en/kriya-payments-b2b-bnpl-extension).\n\nKriya Payments is supported on the following nopCommerce versions:\n- 4.4.0\n- 4.5.0\n- 4.6.0\n\n### Configuring the plugin\n\n1. Log into the nopCommerce Admin Dashboard.\n2. Select `Configuration > Local plugins` option in the left column menu.\n3. Select `Upload plugin or theme`.\n4. Select `Choose file` and select the `.zip` file downloaded from the [nopCommerce Marketplace](https://www.nopcommerce.com/en/kriya-payments-b2b-bnpl-extension).\n5. Select `Upload plugin or theme`.\n6. Select `Restart application to apply changes`.\n7. Select `Configuration > Local plugins`, identify the `Kriya Payments` plugin in the list and select `Install`.\n8. Select `Restart application to apply changes`.\n\n> To update the plugin, you can follow the above steps with a new version of the `.zip` file.\n\n![nopCommerce List Plugin](https://cdn.kriya.co/images/KriyaPaymentsApi-nopCommerce-List-Plugin.png)\n\nAt this point, the plugin has now been installed. To configure the plugin for your store, you should:\n\n1. Select `Configuration > Local plugins` and identify the `Kriya Payments` plugin in the list.\n2. Select `Configure` on the `Kriya Payments` plugin.\n3. Input your `Sandbox` and `Production` (Live) API keys and secrets into the appropriate fields.\n> You can check the `Use Sandbox` option to send any orders to our test environment, prior to sending live orders.\n4. Press `Save changes`\n\n![nopCommerce Configure Plugin](https://cdn.kriya.co/images/KriyaPaymentsApi-nopCommerce-Configure-Plugin.png)\n\nOnce the plugin has been configured, it is ready to be enabled to appear on the stores checkout page:\n\n1. Select `Configuration > Local plugins` and identify the `Kriya Payments` plugin in the list.\n2. Select `Edit` on the `Kriya Payments` plugin.\n3. Check the `Enabled` option and click `Save`.\n\n![nopCommerce Edit Plugin](https://cdn.kriya.co/images/KriyaPaymentsApi-nopCommerce-Edit-Plugin.png)\n\nThe plugin will now be active, and the Kriya payment method will be available on the store checkout.\n\n![nopCommerce Checkout Plugin](https://cdn.kriya.co/images/KriyaPaymentsApi-nopCommerce-Checkout-Plugin.png)\n                                                                        \n## Prestashop\n### Install Module\n\nTo install a module on the Prestashop system you must log into your back office administration dashboard.\nYou can then navigate to the module manager page by clicking on “Modules” in the left hand navigation and selecting “Module Manager”,\n\n![Prestashop Module Manager](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_ModuleManager.png)\n\nYou can then click “Upload a module” in the top right hand corner,\n\n![Prestashop Upload Module](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_UploadModule.png)\n\nThis will open a pop up where you can either drag the module ZIP file onto, or click inside it and find the ZIP file in your file system.\n\n![Prestashop Upload Module Drug & Drop](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_UploadModuleDrugAndDrop.png)\n\nOnce you have selected/dragged the module ZIP file into the popup the module will be uploaded and installed.\n\n![Prestashop Installing Module](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_InstallingModule.png)\n\nOnce successfully installed you can configure the module.\n\n![Prestashop Module Installed](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_InstalledModule.png)\n\n<br/>\n\n### Configure Module\n\nOn the configuration page you can add all of the information that the module needs to function, as well as customise certain aspects of the user journey. Explanations of each part will follow below.\n\n![Prestashop Configure Module](https://cdn.kriya.co/images/KriyaPaymentsApi_Prestashop_ConfigureModule.png)\n\n**Mode:** <br/>\nSetting the mode will determine if you are running the module in TEST mode and using the sandbox API keys, LIVE mode using the production API keys or you set it to DISABLED to stop the payment option loading.\n\n**Sandbox API Key:** <br/>\nThe module needs API details in order to communicate with Kriya, this is where you can enter the API key for the sandbox testing. You can get this from Kriya.\n\n**Sandbox Secret:** <br/>\nFor security purposes, Kriya Payments also needs a “secret”, which you can get by contacting Kriya.\n\n**Production API Key:** <br/>\nThis is where you should put your LIVE API key.\n\n**Production Secret:** <br/>\nThis is where you should put your LIVE secret.\n\n**Webhook Endpoint:** <br/>\nThis is a link through which Kriya will send updates about orders. You will need to copy this link into the “Webhook” section of your Kriya account .\n\n**Fulfilled Order Status:** <br/>\nWhen an order is considered “Fulfilled” in Kriya you can determine which Prestashop order status should be used. The default is Delivered but you can amend this to fit your circumstances.\n\n**Cancelled Order Status:** <br/>\nWhen an order is considered “Cancelled” in Kriya you can determine which Prestashop order status should be used. The default is Cancelled but you can amend this to fit your circumstances.\n\n**Declined Order Status:** <br/>\nWhen an order is considered “Declined” in Kriya you can determine which Prestashop order status should be used. The default is Payment Error but you can amend this to fit your circumstances.\n\n**Draft Order Status:** <br/>\nWhen a draft order is created in Kriya, a corresponding order is created in Prestashop. You can determine which status should be used in the Prestashop order when the order is waiting to be finalised in Kriya. \n\n**Submitted Order Status:**\nWhen an order has been accepted by Kriya, you can determine which Prestashop order status should be used. The default is Payment Accepted.\n\n## Salesforce\n                   \n### How to: Install Kriya Payments from Salesforce AppExchange\n1. Download the Kriya Payments application from the AppExchange\n2. Login as an administrator and open “Installed packages” page\n\n![Salesforce Installed Packages](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_InstalledPackages.png)\n3. Follow the installation instructions\n\n![Salesforce Install Kriya Payments](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_InstallKriyaPayments.png)\n>Contact <payments@kriya.co> for the password\n\n![Salesforce Approve Third Party Access](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_Approve3rdPartyAccess.png)\n![Salesforce Installation Process](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_InstallationProcess.png)\n![Salesforce Installation Completion](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_InstallationCompletion.png)\n\n<br/>\n\n### How to: Configure the Kriya Payments app\n1. **Onboarding**\n  <br> To get started, new customers should contact <payments@kriya.co> with the below details, to receive the API Key and Secret:\n* B2B Store url\n* B2B Store name\n\n2. **Setup the “Apex Classes Access” settings for Buyers:**\n> This setup has to be applied on each buyer profile: if you have more than one buyer profile, repeat the next steps for each one.\n\nThe Kriya Payments application contains a “Kriya Payment button“, a LWC component that is placed on the Checkout page. This component uses APEX classes which need to be enabled and correctly configured:\n* KriyaOrderController - to create a new Salesforce order\n* KriyaPaymentsJourneyController - to create a Kriya order and get a Payment journey URL\n* KriyaSettingsController - to determine possibility to use “Pay later with Kriya“.\n\n<ul> a. Open Users → Profiles and find a Buyer profile (one or more): </ul>\n\n![Salesforce Profile List](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_ProfilesList.png)\n\n<ul>b. Scroll to the “Enabled Apex Class Access” section and click edit:  </ul>\n\n![Salesforce Enable Apex Class Access](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_EnableApexClassAccess.png)\n\n<ul>c. Choose **KriyaOrderController**, **KriyaPaymentsJourneyController** and **KriyaSettingsController** and click Save  </ul>\n\n![Salesforce Enabled Apex Classes Selection](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_EnableApexClassAccessSelection.png)\n![Salesforce Enabled Apex Classes](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_EnabledApexClassAccess.png)\n\n3. **Allow Guest users to access REST endpoints (/callback and /webhook)**\n<br>\nUp-to-date information about the order status is stored in the \"Kriya Transaction\" object. During the processing of an order, its status can be changed by Kriya. The Kriya Payments application automatically synchronizes the status of the order on the Transaction object using the Webhooks mechanism. For proper operation of Webhooks, it is necessary to open public access to the Apex classes that implements this functionality (all transmitted information is securely encrypted).\n   \n<ul>\n   a. Open User Interface → Sites and Domains → Sites <br>\n   b. Register Salesforce Site domain (if necessary) <br>\n   c. Choose a B2B Commerce site\n</ul>\n\n![Salesforce Sites](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_UserInterfaceSites.png)\n<ul> d. Choose ”Public Access Settings” </ul>\n\n![Salesforce Sites Public Assets Settings](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_SitePublicAssetsSettings.png)\n\n<ul> e. Scroll to the “Enabled Apex Class Access“ section, choose <b>KriyaCallbackController</b> and <b>KriyaWebhookController</b> and click Save </ul>\n\n![Salesforce Sites Enable Apex Class Access](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_SiteEnableApexClassAccess.png)\n![Salesforce Sites Enabled Apex Classes](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_SiteEnabledApexClassAccess.png)\n\n4. **Setup KriyaSettings**\n<br> For the proper functioning of the Kriya Payments application, it is necessary to configure the integration with Kriya API.\n>The merchant can have several stores - for each of them they need to configure its own integration settings.\n\n<ul>a. Open the Kriya Payments app</ul>\n\n![Salesforce Kriya Payments App](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_KriyaPaymentsApp.png)\n<ul>b. Choose “Kriya Settings“ tab</ul>\n\n![Salesforce Kriya Payments App Settings](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_KriyaPaymentsApp_KriyaSettings.png)\n<ul>c. Click “New“</ul>\n\n![Salesforce Kriya Payments App Add Settings](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_KriyaPaymentsApp_AddKriyaSettings.png)\n<ul>d. Fill the form:</ul>\n\n![Salesforce Kriya Payments App Fill Form](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_KriyaPaymentsApp_AddKriyaSettingsForm.png)\n\n>  The required information will have been provided by Kriya during the onboarding process.\n\n| **Field**         | **Required** | **Description**                                                                                                                                                                     |\n|-------------------|--------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Store             | Yes          | B2B Commerce store to be configured                                                                                                                                                 |\n| Mode              | Yes          | Working mode: Test or Live                                                                                                                                                          |\n| StagingApiKey     | Yes          | Kriya API key for the test environment                                                                                                                                              |\n| StagingSecret     | Yes          | Kriya API secret for the test environment                                                                                                                                           |\n| ProductionApiKey  | Yes          | Kriya API key for the live environment                                                                                                                                              |\n| ProductionSecret  | Yes          | Kriya API secret for the live environment                                                                                                                                           |\n| OfferAcceptedUrl  | No           | The URL of the B2B Store to which the buyer will be redirected after accepting the offer and completing checkout.By default, the buyer is redirected to a standard “Thank you“ page |\n| OfferDeclinedUrl  | No           | The URL of the B2B Store to which the buyer will be redirected after declining the offer. By default, the buyer is redirected to the “Order details“ page                           |\n| OfferCancelledUrl | No           | The URL of the B2B Store to which the buyer will be redirected after cancelling the Payment Journey. By default, the buyer is redirected to the “Order details“ page                |\n\n<ul>e. Click Save</ul>\n\n![Salesforce Kriya Payments App Settings were added ](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_KriyaPaymentsApp_KriyaSettingsAdded.png)\n\n5. **Add “Pay by Kriya“ component to the Checkout page:**\n<ul>a. Open “Commerce“ app</ul>  \n\n![Salesforce Commerce App](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp.png)\n<ul>b. Choose “Experience Builder”</ul>\n\n![Salesforce Commerce App Administration](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_Administration.png)\n<ul>c. Choose the Checkout page</ul>\n\n![Salesforce Commerce App Checkout page](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_CheckoutPage.png)\n<ul>d. In the “Components” menu, find the “Pay by Kriya” plugin and drag’n’drop it to the corresponding place on the page</ul>\n\n![Salesforce Commerce App Checkout Components](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_CheckoutComponents.png)\n![Salesforce Commerce App Checkout With Kriya](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_CheckoutWithKriya.png)\n<ul>e. Publish changes</ul>\n\n![Salesforce Commerce App Checkout Page Publish](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_CheckoutPublish.png)\n![Salesforce Commerce App Checkout Page Publish Confirmation](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_CommerceApp_CheckoutPublishConfirmation.png)            \n\n<br/>\n\n### How to: Use the Kriya payments app as a buyer\n1. Login to the store \n\n![Salesforce Store Login](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_Store_Login.png)\n2. Add products to the shopping cart and checkout\n   \n![Salesforce Store Add Items to cart](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_Store_AddItemToCart.png)\n3. On the checkout page choose “Pay later with Kriya”\n\n![Salesforce Store Select Pay Later With Kriya Option](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_Store_SelectPayLaterWithKriyaOption.png) \n4. Buyers will be redirected to the “Kriya Payments Journey” where they can identify their business and choose from the pay later options (pay in 30 days/60 days /90 days/…)\n\n<br/>\n\n### How to: Use Kriya payments as an administrator\n\nKriya Payments allows an administrator to configure the checkout options, as well as managing the orders placed using the \"Pay later with Kriya\" option.\n>To get started, follow the instructions in [How to: Configure the Kriya Payments app ](#how-to-configure-the-kriya-payments-app)\n\n<br/>\n\n#### Kriya transactions list\nEach new order created using the \"Pay later with Kriya\" option on the Checkout page, a **new Order (Order Summary)** and corresponding **KriyaTransaction** is logged in Salesforce.\n<br/><br/>\nThe **KriyaTransaction** object stores up-to-date order information from Kriya, automatically updated via webhooks. The main fields of the **KriyaTransaction** object are listed below:\n\n| **Field**     | **Description**                                                                                                                                                                                                                                    |\n|---------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Store         | Salesforce B2B Commerce store where the order was created                                                                                                                                                                                          |\n| Order         | Salesforce Order                                                                                                                                                                                                                                   |\n| Order Summary | Salesforce Order Summary                                                                                                                                                                                                                           |\n| Offer Status  | Status of order going through Kriya Payments Journey, information updated by Kriya service. Possible values: Draft, Accepted, Declined, Cancelled.                                                                                                 |\n| Order Status  | Status of order placed using Kriya Payments after successful checkout, updated by Kriya service. Possible values: Draft, Submitted, ReadyToAdvanced, ReadyToAdvancedRequest, Advanced, Repaid, Overdue, Closed, Cancellation Requested, Cancelled. |\n\nTo view the list of **KriyaTransactions**, the Administrator needs to open the Kriya Payments application and select the \"Kriya Transactions\" tab:\n\n![Salesforce Transactions List](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_TransactionsList.png)\n\nNext, the administrator can find the desired transaction (for example by order number) and open it:\n\n![Salesforce Transaction Details](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_TransactionDetails.png)\n\nEach transaction has a **Kriya Notes** section where the administrator can find further information about changes made from the Kriya service:\n\n![Salesforce Transaction Notes](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_TransactionNotes.png)\n\n> Please, do not edit a **KriyaTransaction** object - it is updated automatically and manual changes could break the normal working flow\n\n<br/>\n\n#### Order cancellation\n![Salesforce Transaction Cancellation](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_TransactionCancellation.png)\n\nIn some cases Administrator can cancel an order. In order to notify Kriya about order cancellation Administrator needs to open corresponding Kriya Transaction and click on \"Cancel Kriya Order\" button\n>It may take some time for the order status to be changed to **Cancelled**. <br/>\n> It is possible to cancel orders only from the following statuses: **Draft, Submitted**.\n\n<br/>\n\n#### Requesting fund\n![Salesforce Transaction Requesting Refund](https://cdn.kriya.co/images/KriyaPaymentsApi_SalesForce_TransactionRequestingRefund.png)\n\nIn order to receive funds from Kriya, the administrator needs to notify Kriya that the goods have been shipped or delivered. To do this on Salesforce, the administrator needs to open corresponding Kriya Transaction and click “Request Funds from Kriya” which will change the order status to **ReadyToAdvance**. Next, Kriya will transfer funds to the merchant’s bank account.\n\n>It may take some time for the order status to be changed to **ReadyToAdvance**.  <br/>\n> It is only possible to “Request funds from Kriya“ only for orders with the **Submitted** order status.\n\n## WooCommerce\n\nKriya Payments is now readily available for WooCommerce merchant stores. To receive the plugin, please get in touch with us at [apisupport@kriya.co](apisupport@kriya.co).\n\n### Configuring the plugin\n\n1. Log into WordPress Admin Dashboard.\n2. Select the `Plugins > Add New` option in the left column menu.\n3. Select `Upload Plugin`.\n4. Select `Drop files or click here to install` and select the `.zip` file provided to you.\n\n> To update the plugin, you can follow the above steps with a new version of the `.zip` file. You do not need to repeat the steps below as they are still stored.\n\nAt this point, the plugin has now been installed. To configure the plugin for your store, you should:\n\n1. In Wordpress Admin Dashboard, select `WooCommerce > Settings` option in the left column menu.\n2. Select the `Payments` tab.\n3. Select the `All payment methods` option at the top of the screen.\n4. Select the `Manage` button on the `Kriya Payments` payment method.\n5. Input your `Test` and `Production` (Live) API keys into the appropriate fields.\n> You can use the `Test mode` to send any orders to our test environment, prior to sending live orders.\n6. Press `Save changes`\n\n![Manage WooCommerce Plugin](https://cdn.kriya.co/images/MarketPay-Manage-WooCommerce-Plugin.png)\n\nThe plugin will now be active and the Kriya payment method is now available on the store checkout.\n\n\n## Other e-commerce platforms\n> If you're interested in using the Kriya Payments API and the platform you're using isn't listed above, please let us know by contacting us a <payments@kriya.co>.\n\n<a name=\"data-types\"></a>\n# Data Types\n\nThe following section outlines some specific ways in which data should be interpreted or sent in requests to and from the API.\n\n## Currency\n\nAll currencies shall be both requested and returned using their [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) codes.\n\n## Monetary Amounts\n\nAny monetary amounts requested and returned via the API shall be represented as their lowest denomination. For example:\n\n- £123.90 is represented as `12390`\n- $50.00 is represented as `5000`\n\n<a name=\"countries\"></a>\n## Countries\n\nWherever a country of registration is required, it must be done so using the [ISO 3166-1 alpha-2 code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).\n\nKriya Payments can service the following countries:\n\n- Austria (AT)\n- Belgium (BE)\n- Bulgaria (BG)\n- Canada (CA)\n- Croatia (HR)\n- Cyprus (CY)\n- Czech Republic (CZ)\n- Denmark (DK)\n- Estonia (EE)\n- Finland (FI)\n- France (FR)\n- Germany (DE)\n- Greece (GR)\n- Hungary (HU)\n- India (IN)\n- Ireland (IE)\n- Israel (IL)\n- Italy (IT)\n- Kingdom of Saudi Arabia (SA)\n- Latvia (LV)\n- Lithuania (LT)\n- Luxembourg (LU)\n- Malta (MT)\n- Netherlands (NL)\n- Norway (NO)\n- Poland (PL)\n- Portugal (PT)\n- Romania (RO)\n- Slovakia (SK)\n- Slovenia (SI)\n- Spain (ES)\n- Sweden (SE)\n- Switzerland (CH)\n- United Arab Emirates (AE)\n\n<a name=\"kriyacompanyidentifier\"></a>\n## Kriya Company Identifier\nKriya Company Identifier is the unique identifier of a limited company in Payments API. It is retrieved firstly via the Kriya Payments API `Search` endpoint.\nFor each subsequent request that requires to identify a limited company, the retrieved Kriya Company Identifier will be used instead of the company identifier.\n\n<a name=\"merchantcompanyidentifier\"></a>\n## Merchant Company Identifier\nMerchant Company Identifier is an optional alias of the KriyaCompanyIdentifier for a limited company, and its purpose is to facilitate the Merchant's operations, allowing them to use their internal identifier of the company. It can be assigned while onboarding the company and from that point it can be used as substitute for the Kriya Company Identifier.\n<br><b>We strongly suggest to prioritise the use of Kriya Company Identifier over Merchant Company Identifier.</b> \n\n<a name=\"companyidentifier\"></a>\n## Company Identifier\nThe identifier of a company (Buyer or Supplier) is the registration number for a Limited Company or the email address or phone number for a Sole Trader. It appears as identifier for Buyers and Suppliers.\n<br>When provided as an input in a request, it should not contain any leading, mid or trailing white character: any white character found will be removed before processing the request.\n<br>Any webhook containing a company identifier will return the information without any leading, mid or trailing white character.\n\n\n<a name=\"defined-types\"></a>\n# Defined Types\n\n> Unless specified otherwise, all properties are `Required` when making API calls.\n\n## Order\n\nThe order is the record of a transaction occurring via Kriya Payments. Several varying validation rules come into play depending on the status of the order. Please see [Order Status](#order-status) for further information.\n\n| Property          | DataType                                           | Description                                                                                                                                           | Constraints                                                                                                                                                   |\n|-------------------|----------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| MerchantOrderId   | String                                             | The unique order identifier from the Merchant.                                                                                                     | It must be between 1 and 150 characters. It must be unique across all orders.                                                                                 |\n| Status            | String (Enum) <br /> [Order Status](#order-status) | The status of the order. Defaults to `Draft` if not specified.                                                                                        | See [Order Status](#order-status). Optional.                                                                                                                  |\n| BuyerCompany      | Object <br /> [Buyer](#buyer)                      | The Buyer company that is purchasing the goods or services. For a subset of details of the Buyer, see [Buyer](#buyer).                                | Optional for `Draft` orders, can not be changed if order status >= `AwaitingPrepayment`.                                                                                                                                  |\n| SupplierCompany   | Object <br /> [Supplier](#supplier)                | The Supplier that provides the goods or services to the Buyer. For a subset of details of the Supplier, see [Supplier](#supplier).                    | Required for Merchants that do not fulfil orders themselves. Optional for all other Merchants.                                                                |\n| User              | Object <br /> [User](#user)                        | The user on the Merchant that is placing the order on behalf of the Buyer company. See [User](#user).                                              | Optional for `Draft` orders.                                                                                                                                  |\n| Payment           | Object <br /> [Payment](#payment)                  | Details of the payment to be made. This includes the order amount and which payment method is being used.                                             | The total amount indicated between supplier and merchant must not exceed the available spending limit of the buyer. See [Payment](#payment) for more details. |\n| DeliveryAddresses | Object <br /> Array [Address](#Address)            | The address or addresses the goods or services are being supplied to. See [Address](#Address).                                                        | Optional for `Draft` orders.                                                                                                                                  |\n| PaymentJourney    | Object <br /> [Payment Journey](#payment-journey)  | The details surrounding the Kriya hosted payments journey, see [Payment Journey](#payment-journey).                                                   | Not required if you are following a [Direct Api Integration](#direct-api-integration) approach. See [Integration Scenarios](#integration-scenarios).          |\n| DeliveryDate      | DateTime                                           | The delivery date for the goods or services to the Buyer.                                                                                             | Optional. It must not be earlier than seven days from the current date.                                                                                       |\n| InvoiceReference  | String                                             | The InvoiceReference number from the Merchant associated with one or many orders. This can be used to group a set of orders with a single Invoice. | Optional for `Draft` orders, can not be changed if order status >= `AwaitingPrepayment`.                                                                                                                                                     |\n| OrderPlacedDate   | DateTime                                           | The date the order was placed on the Merchant.                                                                                                     | Optional. It must not be earlier than seven days from the current date.                                                                                       |\n| IpAddress         | String                                             | The IP Address of a Buyer                                                                                                                             | Optional. Applicable only for Create and Update operations. Singular IP Address up to 45 symbols.                                                             |\n\nThe following examples show the differing minimum requirements for an Order across multiple statuses:\n\n**Draft**\n```json\n{\n  \"merchantOrderId\": \"0001\",\n  \"payment\": {\n    \"supplier\": {\n      \"amount\": 10000\n    }\n  }\n}\n```\n\n**AwaitingPrepayment**\n```json\n{\n  \"status\": \"AwaitingPrepayment\",\n  \"merchantOrderId\": \"0001\",\n  \"payment\": {\n    \"marketplace\":\n    {\n        \"amount\": 2\n    },\n    \"prepayment\":\n    {\n        \"amount\": 1\n    },\n    \"paymentMethod\": \"PAY30\"\n  },\n  \"invoiceReference\": \"INV-001\",\n  \"deliveryAddresses\":\n  [\n      {\n          \"addressLine1\": \"56 Manor Road\",\n          \"addressLine2\": \"School Lane\",\n          \"city\": null,\n          \"region\": \"Bath\",\n          \"postCode\": \"BA20 8XT\"\n      }\n  ],\n  \"user\":\n  {\n      \"email\": \"arty.fischel@user.com\",\n      \"fullName\": \"Arty Fischel\",\n      \"phoneNumber\": \"07777777777\"\n  }\n}\n```\n\n**Submitted**\n```json\n{\n    \"merchantOrderId\": \"0001\",\n    \"status\": \"Submitted\",\n    \"buyerCompany\":\n    {\n        \"kriyaCompanyIdentifier\": \"436D9A38-632F-4080-8C0E-AB0D8ECEBBDA\",\n        \"merchantCompanyIdentifier\": \"GB00123456\",\n        \"companyIdentifier\": \"00123456\",\n        \"companyName\": \"Buyer Company\",\n        \"countryOfRegistration\": \"GB\",\n        \"type\": \"LimitedCompany\"\n    },\n    \"payment\":\n    {\n        \"supplier\":\n        {\n            \"amount\": 1\n        },\n        \"paymentMethod\": \"PAY30\"\n    },\n    \"deliveryAddresses\":\n    [\n        {\n            \"addressLine1\": \"56 Manor Road\",\n            \"addressLine2\": \"School Lane\",\n            \"city\": null,\n            \"region\": \"Bath\",\n            \"postCode\": \"BA20 8XT\"\n        }\n    ],\n    \"user\":\n    {\n        \"email\": \"arty.fischel@user.com\",\n        \"fullName\": \"Arty Fischel\"\n    }\n}\n```\n\n**ReadyToAdvance**\n```json\n{\n    \"merchantOrderId\": \"0001\",\n    \"status\": \"ReadyToAdvance\",\n    \"buyerCompany\":\n    {\n        \"kriyaCompanyIdentifier\": \"436D9A38-632F-4080-8C0E-AB0D8ECEBBDA\",\n        \"merchantCompanyIdentifier\": \"GB00123456\",\n        \"companyIdentifier\": \"00123456\",\n        \"companyName\": \"Buyer Company\",\n        \"countryOfRegistration\": \"GB\",\n        \"type\": \"LimitedCompany\"\n    },\n    \"payment\":\n    {\n        \"supplier\":\n        {\n            \"amount\": 1\n        },\n        \"paymentMethod\": \"PAY30\"\n    },\n    \"deliveryAddresses\":\n    [\n        {\n            \"addressLine1\": \"56 Manor Road\",\n            \"addressLine2\": \"School Lane\",\n            \"city\": null,\n            \"region\": \"Bath\",\n            \"postCode\": \"BA20 8XT\"\n        }\n    ],\n    \"user\":\n    {\n        \"email\": \"arty.fischel@user.com\",\n        \"fullName\": \"Arty Fischel\"\n    }\n}\n```\n\n**Order with all properties populated**\n```json\n{\n    \"merchantOrderId\": \"0001\",\n    \"status\": \"Draft\",\n    \"buyerCompany\":\n    {\n        \"kriyaCompanyIdentifier\": \"436D9A38-632F-4080-8C0E-AB0D8ECEBBDA\",\n        \"merchantCompanyIdentifier\": \"GB00123456\",\n        \"companyIdentifier\": \"00123456\",\n        \"companyName\": \"Buyer Company\",\n        \"countryOfRegistration\": \"GB\",\n        \"type\": \"LimitedCompany\"\n    },\n    \"supplierCompany\":\n    {\n        \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\",\n        \"merchantCompanyIdentifier\": \"GB98765432\",\n        \"companyIdentifier\": \"98765432\",\n        \"companyName\": \"Supplier Company\",\n        \"countryOfRegistration\": \"GB\"\n    },\n    \"payment\":\n    {\n        \"supplier\":\n        {\n            \"amount\": 25000,\n            \"currency\": \"GBP\"\n        },\n        \"merchant\":\n        {\n            \"amount\": 10000,\n            \"currency\": \"GBP\"\n        },\n        \"prepayment\": null,\n        \"paymentMethod\": \"PAY30\"\n    },\n    \"deliveryAddresses\":\n    [\n        {\n            \"addressLine1\": \"56 Manor Road\",\n            \"addressLine2\": \"School Lane\",\n            \"city\": null,\n            \"region\": \"Bath\",\n            \"postCode\": \"BA20 8XT\"\n        }\n    ],\n    \"paymentJourney\":\n    {\n        \"paymentAcceptedRedirectUrl\": \"https://accepted.kriya.co\",\n        \"paymentDeclinedRedirectUrl\": \"https://declined.kriya.co\",\n        \"autoTransitionOnCompletion\": \"Submitted\"\n    },\n    \"user\":\n    {\n        \"email\": \"arty.fischel@user.com\",\n        \"fullName\": \"Arty Fischel\",\n        \"role\": \"Director\",\n        \"phoneNumber\": \"07777777777\"\n    },\n    \"deliveryDate\": \"2022-07-09\",\n    \"invoiceReference\": \"INV-001\",\n    \"orderPlacedDate\": \"2022-07-04\",\n    \"ipAddress\": \"10.10.10.10\"\n}\n```\n\n\n<a name=\"order-status\"></a>\n## Order Status\n\nAn order can be created in any modifiable status as long as constraints have been met. The status can be transitioned to several others, those being:\n\n| Name                        | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           | ReadOnly |\n|-----------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------|\n| Draft                       | The draft order status has no impact on a Buyer's available spending limit. It can either be transitioned to `AwaitingPrepayment`, `Submitted` or `Cancelled`. The `Draft` status will be the default for all newly created orders if no status has been specified.                                                                                                                                                                                                                                                         | No       |\n| AwaitingPrepayment          | A prepayment is required to be paid upfront for this order by the buyer when the buyer's available spending limit is insufficient or the merchant requests prepayment. The PayLater portion of the order in this state has an effect on the buyer spending limit. It can either be automatically transitioned to `Submitted` when prepayment is paid or `Cancelled`.                              | No       |\n| Submitted                   | The order would be transitioned to this status when a customer has chosen to place the order via the Merchant. Upon transitioning to this status, the orders `Payment`, `User`, `BuyerCompany` and `SupplierCompany`, if applicable, must be supplied. The Buyers available spending limit must be >= to the PayLater portion of the order, and if so, the Buyers available spending limit is reduced to reflect this. The order can still be transitioned to `Cancelled` at this point. | No       |\n| ReadyToAdvance              | Transitioning to this status will inform Kriya Payments API to advance funds equivalent to the order amount, minus fees, to both the Merchant and Supplier, where applicable. The same requirements as `Submitted` are needed. At this point, the order cannot be transitioned to `Cancelled`, and **no further updates can be made to the order**.                                                                                                                                                | Yes      |\n| Advanced                    | The funds associated with the order have now been transferred to the relevant parties involved.                                                                                                                                                                                                                                                                                                                                                                                                       | No       |\n| Overdue                     | The Buyer has not fully paid the total amount of the order, including any fees, within the payment period (e.g. 30 days in the case of \"Pay in 30 days\").                                                                                                                                                                                                                                                                                                                                             | No       |\n| Repaid                      | The Buyer has fully repaid the total amount of the order, including any fees. The Buyers available spending limit is increased by the order amount.                                                                                                                                                                                                                                                                                                                                                   | Yes      |\n| Closed                      | The order has been fully completed and is now closed. The Buyers available spending limit is increased by the order amount.                                                                                                                                                                                                                                                                                                                                                                           | Yes      |\n| Cancelled                   | The order has been cancelled. Any deductions to the Buyer's available spending limit have been reverted.                                                                                                                                                                                                                                                                                                                                                                                              | Yes      |\n\nAn order can go through the following transitions:\n\n![Order Transitions](https://cdn.kriya.co/images/KriyaPaymentsAPI-OrderTransitions.png)\n\n\n<a name=\"delivery-confirmation\"></a>\n## Delivery Confirmation\n\nDelivery confirmation evidence allows a Merchant to provide proof that the goods or services for an order have been delivered to the Buyer. Evidence is submitted to the `UploadDeliveryConfirmation` endpoint as `multipart/form-data` and may consist of one or more files, a free-text note, or both. Repeated calls append new evidence rather than replacing existing evidence.\n\nDelivery confirmation evidence can only be submitted while the order is in the `Draft` or `Submitted` status. See [Order Status](#order-status) for more information.\n\n### Request\n\nThe request must be sent as `multipart/form-data` and therefore cannot be sent as JSON.\n\n| Property | DataType       | Description                                             | Constraints                                                     |\n|----------|----------------|---------------------------------------------------------|-----------------------------------------------------------------|\n| files    | Binary (Array) | One or more files evidencing the delivery of the order. | Optional. Sent as file parts of the `multipart/form-data` body. |\n| note     | String         | A free-text note describing the delivery.               | Optional. The field names `notes` and `text` are also accepted. |\n\nExample request:\n\n```\ncurl --request POST \\\n  --url 'https://api.kriya.dev/payments/orders/{merchantOrderId}/deliveryConfirmation' \\\n  --header 'X-Kriya-ApiKey: <your api key>' \\\n  --form 'files=@/path/to/delivery-note.pdf' \\\n  --form 'note=Delivered to reception, signed for on arrival.'\n```\n\n### Response\n\n| Property      | DataType       | Description                                                                                                                       |\n|---------------|----------------|----------------------------------------------------------------------------------------------------------------------------------|\n| uploadedFiles | Object (Array) | The delivery confirmation files that were stored. Each entry contains the `fileId` assigned by Kriya and the original `fileName`. |\n| notesCount    | Integer        | The number of text notes that were accepted.                                                                                     |\n\nExample response:\n\n```json\n{\n  \"uploadedFiles\": [\n    {\n      \"fileId\": \"a206638e-7969-4e2f-88fb-a073f329afbe\",\n      \"fileName\": \"delivery-note.pdf\"\n    }\n  ],\n  \"notesCount\": 1\n}\n```\n\n<a name=\"payment\"></a>\n## Payment\n\nPayment details of the order. During the onboarding of the merchant, the settings are configured to define whether the orders are expected to be fulfilled by the merchant itself or by external suppliers. The payment object properties get validated based on this setting in the following way:\n* When orders are fulfilled by a merchant, Kriya expects to receive a greater than zero amount within the Merchant monetary object, and a zero value amount within the Supplier monetary object.\n* When orders are fulfilled by external suppliers, Kriya expects to receive a greater than zero amount within the Supplier monetary object, and the amount value within the Merchant monetary object can be 0 or greater than zero. For example, an order may be split so that £980 goes to the Supplier and the remaining £20 is payable to the Merchant, which equates to £1,000 owed by the Buyer. When Kriya advances funds,  fees will be taken from the payable amounts, and then the remaining funds will be paid to the Merchant and Supplier as specified. It is the responsibility of the Merchant to define how the order amount should be separated.\n\n| Property      | DataType                                       | Description                                                                                                 | Constraints                                                                                                                                                      |\n|---------------|------------------------------------------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Supplier      | Object <br />  [Monetary Data](#monetary-data) | The total amount of the order payable to the Supplier, excluding any Kriya fees.                            | It must be greater than zero when Merchants do not fulfil orders themselves and must be zero when Merchants fulfil the orders themselves.                        |\n| Merchant      | Object <br />  [Monetary Data](#monetary-data) | The total amount of the order payable to the Merchant, excluding any Kriya fees and prepayment amount.      | It must be greater than zero when Merchants fulfil orders and it's optional (can be null or zero) when they don't fulfil the orders.                             |\n| Prepayment    | Object <br />  [Monetary Data](#monetary-data) | The prepayment amount of the buyer required to pay upfront for the Merchant.                                | It must be greater than zero when Merchants require prepayment amount or Buyers couldn't check out orders exceeding their spending limits and it's optional (can be null or zero) when Merchants don't require prepayment amount or Buyers have sufficient spending limit.                             |\n| PaymentMethod | String                                         | The payment method chosen for the order. e.g. `Pay in 30 days`.                                             | Optional for `Draft` or `Cancelled` orders. Retrieve the available payment methods for the Buyer via the [Buyer Pricing Scheme](#buyer-pricing-scheme) endpoint. |\n\n<a name=\"payment-data\"></a>\n## Payment Data\n\nThe details of the order amount that is payable to either the Merchant or Supplier.\n\n| Property      | DataType      | Description                                                     | Constraints                                                                                                                                                                                                |\n|---------------|---------------|-----------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Amount        | Long (int64)  | The total amount of the order, excluding any Kriya fees.        | It must be greater than zero.                                                                                                                                                                              |\n| CurrencyCode  | String (Enum) | The currency the order is to be purchased in.                   | It must be a valid [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code. It must be one of `USD`, `GBP` or `EUR`. The code must also match the Buyers country of registration, e.g. `USD` for the `US`. |\n| PaymentMethod | String        | The payment method chosen for the order. e.g. `Pay in 30 days`. | Optional for `Draft` or `Cancelled` orders.                                                                                                                                                                |\n\n<a name=\"user\"></a>\n## User\n\nThe user that is making the order on behalf of the Buyer company. If no primary [contact details](#contact-details) have been specified for the Buyer, the details provided here will be used to contact the Buyer if any issues arise with the order.\n\n| Property    | DataType | Description                              | Constraints                                                                                           |\n|-------------|----------|------------------------------------------|-------------------------------------------------------------------------------------------------------|\n| Name        | String   | The full name of the user.               | It must be between 1 and 150 characters. Optional for draft orders.                                   |\n| Email       | String   | The Email address of the user.           | It must be a valid Email address. It must be between 1 and 150 characters. Optional for draft orders. |\n| Role        | String   | The role of the user within the company. | It must be between 1 and 150 characters. Optional.                                                    |\n| PhoneNumber | String   | The contact phone number of the user.    | It must be a valid phone number. This is not limited to UK phone numbers. Optional for draft orders.  |\n\n<a name=\"Address\"></a>\n## Address\n\nThe address details are used to define the delivery address for the order.\n\n| Property     | DataType | Description                 | Constraints                                                                                                                 |\n|--------------|----------|-----------------------------|-----------------------------------------------------------------------------------------------------------------------------|\n| AddressLine1 | String   | First line of the address.  | It must be between 1 and 250 characters.                                                                                    |\n| AddressLine2 | String   | Second line of the address. | It must be between 1 and 250 characters.                                                                                    |\n| City         | String   | Name of the city.           | It must be between 1 and 189 characters.                                                                                    |\n| Region       | String   | Name of the region.         | It must be between 1 and 90 characters.                                                                                     |\n| PostCode     | String   | A valid postal code.        | It must be a valid postal code.                                                                                             |\n| Country      | String   | A valid country             | Optional. If provided, it must be a 2-character [ISO 3166-1 alpha-2 code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) |\n\n<a name=\"payment-journey\"></a>\n## Payment Journey\n\nThe payments journey is only required if you're using the [Payments Journey Integration](#payments-journey-integration). See [Integration Scenarios](#integration-scenarios) for more information.\n\n| Property                   | DataType      | Description                                                                                                                                                                                                                                     | Constraints                      |\n|----------------------------|---------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------|\n| PaymentAcceptedRedirectUrl | String        | The URL that the Payments Journey will redirect to if the customer completes the journey.                                                                                                                                                       | It must be a valid absolute URI. |\n| PaymentDeclinedRedirectUrl | String        | The URL that the payments journey will redirect to if the customer does not complete the journey. This can occur when the Buyer has decided to return to the Merchant, they are ineligible or have insufficient funds to complete the order. | It must be a valid absolute URI. |\n| DeclineStatus              | String (Enum) | The status describes why a Buyer was redirected to the `PaymentDeclinedRedirectUrl`. See [Decline Status](#decline-status) for more information.                                                                                                |                                  |\n| AutoTransitionOnCompletion | String (Enum) | The order status that the order will transition to when the payment journey is completed. See [Order Status](#order-status) for more information.                                                                                               |                                  |\n<a name=\"decline-status\"></a>\n## Decline Status\n\nThe `DeclineStatus` informs you why the user was redirected back to the `PaymentDeclinedRedirectUrl`.\n\n| Property                                      | Description                                                                                                                                                                                                                                                                                                                                                                                       |\n|-----------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| UserInitiated                                 | The user decided to return to the Merchant and no longer proceed with the order at this time. e.g. They may wish to add additional items to their basket or choose an alternative payment method.                                                                                                                                                                                                 |\n| Ineligible                                    | Kriya Payments were unable to transact with the Buyer as they have not been or are no longer in the `Approved` status.                                                                                                                                                                                                                                                                            |\n| InsufficientFunds                             | Kriya Payments were unable to transact with the Buyer as their available spending limit is less than the amount of the current order.                                                                                                                                                                                                                                                             |\n| OnboardingChecksAreRequired                   | Kriya Payments couldn't process the transaction with the Buyer due to the failure of the Merchant's requirement for one of its directors to complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.                                                                            |\n| OnboardingChecksAreFailed                     | Kriya Payments couldn't process the transaction with the Buyer due to the failure of the Merchant's requirement for one of its directors to successfully complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section.                                                               |\n| InsufficientFundsOnboardingChecksAreRequired  | Kriya Payments were unable to transact with the Buyer as their available spending limit is less than the amount of the current order and due to the failure of the Merchant's requirement for one of its directors to complete additional onboarding checks. For more details on additional onboarding checks, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section. |\n\n<a name=\"buyer\"></a>\n## Buyer\n\nThe Buyer is a business on the Merchant that is purchasing the goods or services from a Supplier or the Merchant directly. A Buyer must be registered on the Kriya Payments platform and have received an approved limit before they can submit orders. Currently, only Limited Company Buyers creation is supported via Payments Api.\n\n| Property                  | DataType                                          | Description                                                                                                                                                                                                                                                                                                                                                                                                  | Constraints                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     |\n|---------------------------|---------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Name                      | String                                            | The legal name of the company. LimitedCompany names are retrieved by Kriya based on either the KriyaCompanyIdentifier or MerchantCompanyIdentifier. SoleTraders are set to the Directors name.                                                                                                                                                                                                               |                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |\n| KriyaCompanyIdentifier    | UUID                                              | The unique identifier for the company in Kriya. It can be retrieved using the Kriya Payments API `Search` endpoint<br>                                                                                                                                                                                                                                                                                       |                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |\n| MerchantCompanyIdentifier | String                                            | The unique identifier for the company in Merchant's systems. It can be assigned to the company during the onboarding<br>                                                                                                                                                                                                                                                                                     | If provided, it must be unique across all buyers and suppliers and it must be between 1 and 128 characters.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     |\n| CompanyIdentifier         | String                                            | The identifier for the company, i.e. registration number for a `LimitedCompany` or Email address or phone number for a `SoleTrader`.                                                                                                                                                                                                                                                                         | **LimitedCompany**:<br>It must be between 1 and 20 characters. <br>`GB` based companies must provide a valid 8-character registration\
    \ number that can be found on [Companies House](https://www.gov.uk/government/organisations/companies-house).<br>`FR` based companies must provide a valid SIREN (9 digits) or SIRET (14 digits) number.<br>`IE` based companies must provide a valid 6 digit company number. <br>Note: all leading, mid and trailing white characters in the string will be removed automatically.<br> <br>**SoleTrader**:<br> It must be a valid Email address or phone number. <br>Note: all leading, mid and trailing white characters in the string will be removed automatically.<br> |\n| CountryCode               | String                                            | The code that identifies the country of incorporation of the Buyer's company. The spending limit currency will be assigned based on this. `GB` will be defaulted to if not specified.                                                                                                                                                                                                                        | It must be a 2-character [ISO 3166-1 alpha-2 code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2). Optional.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |\n| Type                      | String (Enum)                                     | The Buyer's company type. This will default to `LimitedCompany` if not supplied. The `SoleTrader` type does not yet support any automated risk decisions and therefore, manual intervention is always required.                                                                                                                                                                                              | One of `LimitedCompany`, `SoleTrader`. Optional.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| ContactDetails            | Object <br /> [Contact Details](#contact-details) | The primary contact details for the Buyer company. Any correspondence, in particular, relating to overdue orders will also be sent to the details provided here. Otherwise, only the individual user that created the order will be contacted.                                                                                                                                                               | See the [Contact Details](#contact-details) definition. Optional.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |\n| Status                    | String (Enum)                                     | The status given to the Buyer company from the Kriya Payments risk team. This determines whether or not they can transact with us. See [Buyer/Supplier Decision Status](#buyer-supplier-decision-status) for further details.                                                                                                                                                                                | Only returned by Kriya Payments API responses. This will be ignored if included in any requests.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| TotalLimit                | Long (int64)                                      | The spending limit provided to the Buyer by the Kriya Payments risk team. A Buyers spending limit is always under continuing review, and Kriya Payments may increase or decrease a Buyers spending limit over time.                                                                                                                                                                                          | The value provided will be >= 0. Only returned by Kriya Payments API responses. This will be ignored if included in any requests.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |\n| AvailableLimit            | Long (int64)                                      | The amount that remains of the Buyer's total limit that they have to transact with using Kriya Payments.                                                                                                                                                                                                                                                                                                     | Only returned by Kriya Payments API responses. This will be ignored if included in any requests.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| UsedLimit                 | Long (int64)                                      | The total amount of the limit currently utilised across all active orders. Typically, this may be the TotalSpendingLimit-AvailableSpendingLimit. However, if a Buyer is rejected and their limits are set to zero, you can still see limit utilisation.                                                                                                                                                      | Only returned by Kriya Payments API responses. This will be ignored if included in any requests.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| RejectionReasons          | String Array                                      | If the `Status` of the buyer is `Rejected` then one or more rejection reasons will be returned to help inform as to why the rejection has occurred. See [Rejection Reasons](#rejection-reasons).                                                                                                                                                                                                             | Only returned by Kriya Payments API responses. This will be ignored if included in any requests.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n\n**Minimum details for a Buyer to be created**<br>\n**Note:** This will create a `LimitedBuyer` for `GB` as defaults are applied for optional fields.\n```json\n{\n    \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\"\n}\n```\n\n**Full details that can be specified**<br>\n**LimitedCompany**\n```json\n{\n    \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\",\n    \"merchantCompanyIdentifier\": \"GB12345678\",\n    \"companyIdentifier\": \"12345678\",\n    \"countryCode\": \"GB\",\n    \"type\": \"LimitedCompany\",\n    \"contactDetails\": {\n        \"name\": \"Arty Fischel\",\n        \"email\": \"arty.fischel@user.com\",\n        \"role\": \"Director\",\n        \"phoneNumber\": \"+447825998724\"\n    }\n}\n```\n\n<a name=\"buyer-pricing-scheme\"></a>\n## Buyer Pricing Scheme\n\nThe pricing scheme for a Buyer refers to the possible payment methods available to them, including the fee percentage payable by the Buyer for each method. Pricing schemes are only returned by the API and cannot be modified.\n\n| Property      | DataType | Description                                                                                                                             | Constraints                                                                        |\n|-----------------|----------|-----------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|\n| Identifier      | String   | The unique identifier for the payment method. The identifier is used when specifying the `PaymentMethod` for an `Order`., e.g. 'PAY30'. |                                                                                    |\n| Name            | String   | The name of the payment method.                                                                                                         |                                                                                    |\n| Description     | String   | The description of the payment method.                                                                                                  |                                                                                    |\n| IsEnabled       | Boolean  | A flag that identifies whether or not this payment method can be used by the Buyer.                                                     |                                                                                    |\n| FeePercentage   | Decimal  | The fee percentage payable by the Buyer that is added onto the total amount of their order.                                             | Returned as a decimal value between 0 and 100. e.g. 1.5 would be a 1.5% Buyer fee. |\n| IsPayNowEnabled | Decimal  | A flag to determine if the pay now option is enabled for the payment option.                                                    |                                                                                    |\n\n\n<a name=\"buyer-supplier-decision-status\"></a>\n## Buyer Decision Status\n\nKriya Payments reviews Buyers regularly and may increase or decrease an approved Buyer's spending limit. In addition to this, Kriya Payments may also reject or require further review of Buyers, which will prevent them from placing other orders. The following statuses can be found for a Buyer:\n\n| Name      | Description                                                                                                                                                                                                                                                                                                              |\n|-----------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Submitted | The Buyer has been registered, but no risk decision has been made. The automatic risk decision has been triggered to generate a decision.                                                                                                                                                                                |\n| InReview  | The Buyer is currently being reviewed. Further information is needed before a decision can be made, and manual intervention is required by the Kriya Payments risk team. The company may be contacted to provide further details.                                                                                        |\n| Approved  | The Buyer has been approved and now has a spending limit > 0.                                                                                                                                                                                                                                                            |\n| OnHold    | The Buyer has been placed on hold. New orders cannot be placed until the Buyer is `Approved`, but amending and transitioning already created orders will still be allowed.                                                                                                                                               |\n| Rejected  | The Buyer has been rejected and will not be able to transact using Kriya Payments. If the Buyer was previously `Approved`, their spending limit would now be 0. One or more rejection reasons will be provided to provide further detail on why a Buyer have been rejected. See [Rejection Reasons](#rejection-reasons). |\n\n<a name=\"rejection-reasons\"></a>\n### Rejection Reasons\n\nIf a Buyer has been placed into a status of Rejected, one or more reasons for the rejection will be provided. This is intended to enhance transparency and provide clearer insights into our decision-making process, allowing you to better understand the reasons behind such rejections.\n\n> Please note that the rejection reasons are intended solely for the Merchant's information and should not be displayed to the Buyer.\n\nAs the potential list of rejection reasons is subject to change, we cannot provide an exhaustive list. Additionally, these reasons should not be treated as string identifiers that programmatically influence system behaviour.\n\nIf there are any questions regarding the interpretation of a specific rejection reason or the reasons for a specific buyer's rejection, please reach out to your account manager for further clarification.\n\n<a name=\"contact-details\"></a>\n## Contact Details\n\nThe primary contact details are used for the Buyer company. Any correspondence, in particular, relating to overdue orders will be sent to the details provided here. Otherwise, the individual user that created the order will be contacted.\n\n| Property    | DataType | Description                                         | Constraints                                                                                             |\n|-------------|----------|-----------------------------------------------------|---------------------------------------------------------------------------------------------------------|\n| Name        | String   | The full name of the primary contact.               | It must be between 1 and 150 characters. Optional for `Draft` orders.                                   |\n| Email       | String   | The Email address of the primary contact.           | It must be a valid Email address. It must be between 1 and 150 characters. Optional for `Draft` orders. |\n| Role        | String   | The role of the primary contact within the company. | It must be between 1 and 150 characters. Optional for `Draft` orders.                                   |\n| PhoneNumber | String   | The contact phone number of the primary contact.    | It must be a valid phone number. This is not limited to UK phone numbers. Optional for `Draft` orders.  |\n\n<a name=\"monetary-data\"></a>\n## Monetary data\n\nThe structure of the monetary data is composed of the amount and the currency.\n\n| Property     | DataType      | Description                                 | Constraints                                                                                                                                                                                                |\n|--------------|---------------|---------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Amount       | Long (int64)  | The amount expressed in the currency below. | It must be greater than zero.                                                                                                                                                                              |\n| CurrencyCode | String (Enum) | The currency related to the amount above.   | It must be a valid [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code. It must be one of `USD`, `GBP` or `EUR`. The code must also match the Buyers country of registration, e.g. `USD` for the `US`. |\n\n\n<a name=\"webhooks\"></a>\n# Webhooks\n\nThe Kriya Payments API uses webhooks to send `POST` requests to your application when a specific event occurs across several entities. This mechanism ensures that your apps can stay in sync with Kriya Payments data or allow you to react to particular events. Webhooks also provide a better alternative than polling specific endpoints for changes.\n\nAll supported event types will be sent to the same Webhook URL provided. The following event types are supported via webhooks:\n\n- **BuyerRiskDecisionChanged** - The Kriya Payments risk decision has changed for a Buyer. Either an already `Approved` Buyer has had their spending limit increased/decreased, a Buyer status has transitioned to a different [Order Status](#order-status), e.g. this could be a result of our automated risk decision or a Buyer's Onboarding status change during onboarding process. For more details on Onboarding process, please refer to the [Kriya Onboarding](https://docs.kriya.co/onboarding) section. \n- **BuyerAvailableLimitChanged** - An event has occurred that has altered the available spending limit for the Buyer. Examples of this may be an order transitioning to a new status, such as `Submitted`, `ReadyToAdvance` or `Repaid`, etc. The value of an order has changed, the buyer belongs to multiple Merchants and has transacted elsewhere or our risk team have altered the status/limit of the Buyer directly.\n- **OrderStatusChanged** - An order has transitioned to a different status. This is particularly useful for tracking operational activities beyond the checkout process. For example, an order moves from `Advanced` to `Repaid` when a successful payment has been made by a Buyer. See [Order Status](#order-status) to see all transitions. The message will also contain the available spending limit of the Buyer.\n- **SupplierRiskDecisionChanged** - The Kriya Payments risk decision has changed for a Supplier. It occurs when the status of a Supplier is transitioned to another [Order Status](#order-status) by the Kriya Payments Risk team. There are no automated decisions for Suppliers yet.\n\nThe payload you will receive from the webhook will be sent using the following structure:\n\n| Property  | DataType | Description                                                             |\n|-----------|----------|-------------------------------------------------------------------------|\n| Type      | String   | The defined `Type` of the event that triggered the webhook to be sent.  |\n| Timestamp | DateTime | The date and time that the event occurred.                              |\n| Message   | Object   | The object that relates specifically to the `Type` of event being sent. |\n\nThe possible `Message` object structures for the events types are:\n\n**BuyerRiskDecisionChanged**\n```json\n{\n    \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\",\n    \"merchantCompanyIdentifier\": \"GB12345678\",\n    \"companyIdentifier\": \"12345678\",\n    \"countryCode\": \"GB\",\n    \"companyType\": \"limitedcompany\",\n    \"limit\": 15000000,\n    \"status\": \"Approved\",\n    \"currentBalance\": 14100000,\n    \"usedLimit\": 900000,\n    \"rejectionReasons\": [\n        \"UNSUPPORTED INDUSTRY\",\n        \"AGE OF DIRECTOR\"\n    ],\n    \"onboardingStatus\": \"Passed\"\n}\n```\n**BuyerAvailableLimitChanged**\n```json\n{\n    \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\",\n    \"merchantCompanyIdentifier\": \"GB12345678\",\n    \"companyIdentifier\": \"12345678\",\n    \"countryCode\": \"GB\",\n    \"companyType\": \"limitedcompany\",\n    \"limit\": 15000000,\n    \"currentBalance\": 14100000,\n    \"currencyCode\": \"GBP\",\n    \"usedLimit\": 900000\n}\n```\n**OrderStatusChanged**\n```json\n{\n    \"merchantOrderId\": \"0001\",\n    \"paymentReference\": \"MPXXXXX\",\n    \"invoiceReference\": \"INV-001\",\n    \"oldStatus\": \"Draft\",\n    \"newStatus\": \"Submitted\",\n    \"buyerCurrentBalance\": 1500000,\n    \"totalAmount\": {\n        \"amount\": 100,\n        \"currency\": \"GBP\"\n    }\n}\n```\n**SupplierRiskDecisionChanged**\n```json\n{\n    \"kriyaCompanyIdentifier\": \"7527900F-0D74-4928-805A-C29ABA59D771\",\n    \"merchantCompanyIdentifier\": \"GB12345678\",\n    \"companyIdentifier\": \"12345678\",\n    \"countryCode\": \"GB\",\n    \"status\": \"Approved\"\n}\n```\n\nThe following example shows what a complete webhook request may look like:\n```json\n{\n    \"type\": \"OrderStatusChanged\",\n    \"message\": {\n        \"merchantOrderId\": \"0001\",\n        \"paymentReference\": \"MPXXXXX\",\n        \"invoiceReference\": \"INV-001\",\n        \"oldStatus\": \"Draft\",\n        \"newStatus\": \"Submitted\",\n        \"buyerCurrentBalance\": 1500000,\n        \"totalAmount\": {\n            \"amount\": 100,\n            \"currency\": \"GBP\"\n        }\n    },\n    \"timestamp\": \"2022-03-28T15:09:21.5369596+00:00\"\n}\n```\n\n## Configuring Webhooks\n\nA single URL on your server to receive requests is required for us to set up your webhook. To set this up, please get in touch with us at <apisupport@kriya.co>, and we can configure this for you in both your test and production environments.\n\n## Verifying Webhooks\n\nWhen your server receives requests from webhooks, the authenticity and integrity of the request should be verified. You will be able to perform this verification by generating a hash-based message authentication code (HMAC) based on the payload in the webhook request and a secret `key` specific to you.\n\nThe Kriya Payments API signs the payload in the request and includes a [base64-encoded](https://tools.ietf.org/html/rfc4648#section-4) HMAC in the request header `X-Kriya-Signature`. To verify the webhook was sent from the Kriya Payments API and the integrity of the payload, you should:\n\n1. Retrieve the `key` that you should have received from the Kriya team. This should be stored securely on your server.\n2. Generate an HMAC-SHA256 hash based on the payload you received in the request and your HMAC `key`.\n3. The generated hash should be base64-encoded.\n4. Compare this generated value with the value from `X-Kriya-Signature`. If the two values match, then the webhook has been verified as being sent from the Kriya Payments API.\n\nCode sample (C#, .NET):\n\n```cs\nusing System.Security.Cryptography;\nusing System.Text;\n...\nusing var hmacSha256 = new HMACSHA256(Encoding.UTF8.GetBytes(hmacKey));\nvar hashBytes = hmacSha256.ComputeHash(Encoding.UTF8.GetBytes(payload));\nvar isVerified = xKriyaPaymentsSignature.Equals(Convert.ToBase64String(hashBytes));\n```\n\n> If you haven't received your HMAC key yet? Please get in touch with us at [apisupport@kriya.co](apisupport@kriya.co).\n\n## Limitations and Best Practices\n\n### Acknowledgement and Retries\n\nAny requests made to the URL specified must return an acknowledgement by providing a `2XX` response. If no acknowledgement is made, Kriya Payments will retry your URL up to 3 times with an exponential backoff of 2 seconds for each retry (i.e. 2s, 4s, 8s) until retries are exhausted. If retries have been exhausted, Kriya Payments will contact you and provide further details and decide if/when webhooks should be replayed.\n\n### Reconciliation\n\nAs mentioned above, webhook delivery is not always guaranteed. It is therefore suggested that the Merchant implements relevant mechanisms to synchronise any data they require from Kriya Payments to their applications regularly, e.g. recurring data fetching.\n\n### Delayed Requests\n\nThere may be times when webhook requests are made with a delay since the event occurred. This may be due to processing times on Kriya Payments or due to retries made to the server for the webhook URL. It is suggested that the `Timestamp` received on every request is reviewed to determine if you perceive the data to be 'stale' and instead, either the webhook event is ignored if a more recent one has been provided or the Kriya Payments API called directly to re-retrieve the latest data.\n\n<a name=\"api-environments\"></a>\n# API Environments\n\nThe API currently supports two environments, that is, both **Test** and **Production**. Please note that you must request access to these environments separately and receive API keys for both.\n\n## Test\n\nThe Test API can be accessed through the base URL [https://api.kriya.dev/payments/](https://api.kriya.dev/payments/)\n\nThe Test environment has been created to allow partners to test their integrations. Alongside this, the Test API also supports overriding certain internal operations to support testing scenarios during integrations. See [Test Scenarios Simulators](#test-scenarios-simulators) for more details.\n\n> You may, on occasion, find API requests taking over 1 second anywhere up to 15 seconds. This is due to the technology being used in our test environment where cold starts can occur. This will not be the case in the Production environment.\n\n<a name=\"test-scenarios-simulators\"></a>\n### Test Scenario Simulators\n\nWhen integrating with the Kriya Payments API, there may be certain situations that you want to be able to test and ensure your integration handles successfully, for example, when an order is `Repaid`. In our test environment, we have provided a set of API endpoints that can be used to simulate these scenarios that you would not typically be able to do directly via the production endpoints.\n\n#### Buyer/Supplier Decisioning\n\nThis is valuable in instances where you need to test specific scenarios against Buyers/Suppliers with a certain status or spending limit. Without calling this endpoint, any newly registered Buyers/Suppliers on the Test environment may resolve to one of the possible [Buyer/Supplier Decision Statuses](#buyer-supplier-decision-status) due to our automated risk decisions and is, therefore, non-deterministic.\n\nTo override this, you can use the Test environment-specific endpoints to transition a Buyer/Supplier to a specific status or set a spending limit for a Buyer:\n\n- `/api/scenario/Buyers/risk-decision`\n- `/api/scenario/Suppliers/risk-decision`\n\n#### Order Status Transitions\n\nThere are several [Order Statuses](#order-status) that an order can be transitioned to. However, a number of them are not possible to be set by the API as they are only transitioned to the statuses internally within Kriya Payments. However, to ensure you can test orders in these specific statuses, we have provided an endpoint on the Test environment that allows you to transition your order to a valid [Order Status](#order-status).\n\nPlease note that whilst you can transition to these internal statuses, the transition must still be valid. For example, you cannot move a `ReadyToAdvance` order directly to `Repaid` without transitioning to `Advanced` first.\n\n- `/api/scenario/orders/{merchantOrderId}/transition`\n\n## Production\n\nThe Production API can be accessed through the base URL [https://api.kriya.co/payments/](https://api.kriya.co/payments/).\n\n<a name=\"support\"></a>\n# Support\n\nIf you have any questions concerning API or suggestions or are facing any issues, please get in touch with us at <apisupport@kriya.co>.\n\nIf you're interested to learn more about how Kriya Payments can help your business, you can either request a demo [here](https://kriya.co/embeddedfinance) or contact us at <payments@kriya.co>.\n\n# API Endpoints\n"
