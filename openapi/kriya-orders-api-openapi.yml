openapi: 3.2.0
info:
  title: Kriya Payments Orders API
  description: '# Introduction

    Welcome to Kriya Payments API, the platform that allows partners to offer a Buy Now Pay Later (BNPL) payment scheme to their business customers.'
  contact:
    name: Support
    url: https://kriya.co/
    email: apisupport@kriya.co
  version: ''
  x-logo:
    url: https://cdn.kriya.co/images/Kriya-Putty-Large.svg
    backgroundColor: '#00283C'
    altText: Kriya Logo
servers:
- url: http://localhost:7071/api
- url: https://api.kriya.dev/payments/
  description: Test Environment
- url: https://api.kriya.co/payments/
  description: Production Environment
tags:
- name: Orders
paths:
  /scenario/orders/{merchantOrderId}/transition:
    post:
      tags:
      - Orders
      summary: Transitions an order status
      description: Transitions the status of a single order to another status. Any valid transition can be made, even those that are otherwise read-only.
      operationId: TransitionOrderStatusScenario
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      requestBody:
        description: The new status for the order to be transitioned to.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transitionOrderStatusRequest'
      responses:
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '200':
          description: Transition was made successfully.
  /orders:
    post:
      tags:
      - Orders
      summary: Initiates a new order transaction
      description: Initiates a new order transaction between buyer and supplier or merchant.
      operationId: CreateOrder
      requestBody:
        description: Data of the order to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createOrderRequest'
      responses:
        '201':
          description: Data of the order to be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createOrderResponse'
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
  /orders/many:
    post:
      tags:
      - Orders
      summary: Searches orders by specific filters
      description: Search orders by specific filters
      operationId: OrdersMany
      requestBody:
        description: Data of the orders to be searched.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getManyOrdersRequest'
      responses:
        '200':
          description: Resulting filtered list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getManyOrdersResponse'
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '500':
          description: Something went wrong, please get in touch with tech team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
  /orders/{merchantOrderId}/session/{sessionId}:
    get:
      tags:
      - Orders
      summary: Get current session state
      operationId: GetOrderMfaSession
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: The unique identifier of the mfa session that has been started for the order with merchantOrderId identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '200':
          description: Mfa session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getOrderMfaSessionResponse'
  /orders/{merchantOrderId}:
    get:
      tags:
      - Orders
      summary: Retrieves order details by merchant ID
      description: Retrieves detailed information about an order using the merchant's order ID.
      operationId: GetOrder
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getOrderResponse'
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '500':
          description: Something went wrong, please get in touch with tech team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
    put:
      tags:
      - Orders
      summary: Modifies order details
      description: Modifies the details of an existing order.
      operationId: UpdateOrder
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      requestBody:
        description: Data of the order to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateOrderRequest'
      responses:
        '200':
          description: Data of the order to be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateOrderResponse'
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
  /orders/{merchantOrderId}/transition:
    post:
      tags:
      - Orders
      summary: Transitions an order status
      description: Transitions the status of a single order to another status
      operationId: TransitionOrderStatus
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      requestBody:
        description: The new status for the order to be transitioned to.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transitionOrderStatusRequest'
      responses:
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '200':
          description: Transition was made successfully.
  /orders/{merchantOrderId}/deliveryConfirmation:
    post:
      tags:
      - Orders
      summary: Uploads delivery confirmation evidence for an order
      description: Uploads delivery confirmation evidence (one or more files and/or text notes) for an order. Sent as multipart/form-data. Repeated calls append new evidence rather than replacing existing evidence.
      operationId: UploadDeliveryConfirmation
      parameters:
      - name: merchantOrderId
        in: path
        description: The unique identifier of the order on the partner platform.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The delivery confirmation evidence that was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uploadDeliveryConfirmationResponse'
        '401':
          description: Invalid API Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '400':
          description: The request body could not be understood by the server or contains semantic errors. The response body provides details of the specific reason for the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
        '404':
          description: The resource with this identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problemDetails'
components:
  schemas:
    getOrderResponse:
      type: object
      properties:
        paymentJourney:
          $ref: '#/components/schemas/paymentJourney'
        merchantOrderId:
          type: string
          description: The unique identifier of the order on the partner platform.
        status:
          type:
          - string
          - 'null'
          description: Current status of the order.
        buyerCompany:
          $ref: '#/components/schemas/buyerCompanyDetails'
        supplierCompany:
          $ref: '#/components/schemas/supplierCompanyDetails'
        user:
          $ref: '#/components/schemas/user'
        payment:
          $ref: '#/components/schemas/orderPaymentInfo'
        deliveryAddresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/address'
          description: The addresses the goods are to be delivered to.
        deliveryDate:
          type:
          - string
          - 'null'
          description: The date that the goods within the order were delivered to the buyer.
          format: date-time
        invoiceReference:
          type:
          - string
          - 'null'
          description: The InvoiceReference number from the MarketPlace associated with one or many orders. This can be used to group a set of Orders create against a single Invoice.
        paymentReference:
          type:
          - string
          - 'null'
          description: The PaymentReference associated to the order. The same can be associated with one or many orders. This can help in the reconciliation process.
        orderPlacedDate:
          type:
          - string
          - 'null'
          description: The date the order was placed on the partner platform.
          format: date-time
    getManyOrdersRequest:
      type: object
      properties:
        invoiceReferences:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of invoice references to search.
        pageSize:
          type:
          - integer
          - 'null'
          description: 'The maximum number of items to return. Min: 1 Max: 1000'
          format: int32
    uploadDeliveryConfirmationResponse:
      type: object
      properties:
        uploadedFiles:
          type: array
          items:
            $ref: '#/components/schemas/uploadedDeliveryConfirmationFile'
        notesCount:
          type: integer
          format: int32
    createOrderRequest:
      required:
      - merchantOrderId
      type: object
      properties:
        ipAddress:
          maxLength: 45
          type:
          - string
          - 'null'
          description: Buyer IP Address
        merchantOrderId:
          type: string
          description: The unique identifier of the order on the partner platform.
        status:
          enum:
          - Draft
          - AwaitingPrepayment
          - Submitted
          - ReadyToAdvance
          - Advanced
          - Repaid
          - Overdue
          - Closed
          - Cancelled
          type:
          - string
          - 'null'
          description: The initial status the order should be created with. By default this will be Draft if not specified.
        buyerCompany:
          $ref: '#/components/schemas/buyerDetails'
        supplierCompany:
          $ref: '#/components/schemas/supplierCompanyDetails'
        payment:
          $ref: '#/components/schemas/orderPaymentInfo'
        deliveryAddresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/address'
          description: The addresses the goods are to be delivered to.
        paymentJourney:
          $ref: '#/components/schemas/paymentJourney'
        user:
          $ref: '#/components/schemas/user'
        deliveryDate:
          type:
          - string
          - 'null'
          description: The date that the goods within the order were delivered to the buyer.
          format: date-time
        invoiceReference:
          type:
          - string
          - 'null'
          description: The InvoiceReference number from the Merchant associated with one or many orders. This can be used to group a set of Orders create against a single Invoice.
        orderPlacedDate:
          type:
          - string
          - 'null'
          description: The date the order was placed on the partner platform.
          format: date-time
    transitionOrderStatusRequest:
      type: object
      properties:
        newStatus:
          enum:
          - Draft
          - AwaitingPrepayment
          - Submitted
          - ReadyToAdvance
          - Advanced
          - Repaid
          - Overdue
          - Closed
          - Cancelled
          type: string
          description: The status to transition the order to.
        repayment:
          $ref: '#/components/schemas/repaymentData'
    baseOrder:
      type: object
      properties:
        merchantOrderId:
          type: string
          description: The unique identifier of the order on the partner platform.
        status:
          type:
          - string
          - 'null'
          description: Current status of the order.
        buyerCompany:
          $ref: '#/components/schemas/buyerCompanyDetails'
        supplierCompany:
          $ref: '#/components/schemas/supplierCompanyDetails'
        user:
          $ref: '#/components/schemas/user'
        payment:
          $ref: '#/components/schemas/orderPaymentInfo'
        deliveryAddresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/address'
          description: The addresses the goods are to be delivered to.
        deliveryDate:
          type:
          - string
          - 'null'
          description: The date that the goods within the order were delivered to the buyer.
          format: date-time
        invoiceReference:
          type:
          - string
          - 'null'
          description: The InvoiceReference number from the MarketPlace associated with one or many orders. This can be used to group a set of Orders create against a single Invoice.
        paymentReference:
          type:
          - string
          - 'null'
          description: The PaymentReference associated to the order. The same can be associated with one or many orders. This can help in the reconciliation process.
        orderPlacedDate:
          type:
          - string
          - 'null'
          description: The date the order was placed on the partner platform.
          format: date-time
    user:
      type:
      - object
      - 'null'
      properties:
        email:
          type:
          - string
          - 'null'
          description: Email of the user.
        fullName:
          type:
          - string
          - 'null'
          description: First and Last Name of the user.
        role:
          type:
          - string
          - 'null'
          description: User role in the company.
        phoneNumber:
          type:
          - string
          - 'null'
          description: User phone number.
      description: Details of the user creating the order.
    updateOrderRequest:
      type: object
      properties:
        buyerCompany:
          $ref: '#/components/schemas/buyerCompanyDetails'
        supplierCompany:
          $ref: '#/components/schemas/supplierCompanyDetails'
        payment:
          $ref: '#/components/schemas/orderPaymentInfo'
        deliveryAddresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/address'
          description: The addresses the goods are to be delivered to.
        paymentJourney:
          $ref: '#/components/schemas/paymentJourney'
        user:
          $ref: '#/components/schemas/user'
        deliveryDate:
          type:
          - string
          - 'null'
          description: The date that the goods within the order were delivered to the buyer.
          format: date-time
        invoiceReference:
          type:
          - string
          - 'null'
          description: The InvoiceReference number from the Merchant associated with one or many orders. This can be used to group a set of Orders create against a single Invoice.
        ipAddress:
          maxLength: 45
          type:
          - string
          - 'null'
          description: Buyer IP Address
    problemDetails:
      type: object
      properties:
        title:
          type: string
          description: The high level message returned for an non-success response.
        message:
          type: string
          description: A description of the issue.
        errors:
          type: array
          items:
            type: string
          description: The individual errors that caused the non-success response.
        date:
          type: string
          description: The date and time at which the errors occured.
          format: date-time
        operationId:
          type: string
          description: The unique identifier for the operation where the error was caused. This will be of use and should be provided when requesting further support.
    supplierCompanyDetails:
      type:
      - object
      - 'null'
      properties:
        companyName:
          type:
          - string
          - 'null'
          description: The legal name of the company
        companyIdentifier:
          type:
          - string
          - 'null'
          description: The identifier for the company, i.e. registration number only.
        countryOfRegistration:
          type:
          - string
          - 'null'
          description: The ISO-3166 alpha-2 country code
        kriyaCompanyIdentifier:
          type:
          - string
          - 'null'
          description: Unique identifier of the company in Kriya.
          format: uuid
        merchantCompanyIdentifier:
          type:
          - string
          - 'null'
          description: Unique identifier of the company for the Merchant.
      description: The company providing the goods to the buyer. This is only required if the partner themselves are not fulfilling the order. Once a supplier has been set, it cannot be reverted.
    getOrderMfaSessionResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the mfa session.
          format: uuid
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/mfaRecipient'
          description: List of Mfa request recipients.
        state:
          enum:
          - 0
          - 1
          - 2
          type: integer
          description: Session's state.
          format: int32
        description:
          type: string
          description: Description that contains additional information about session state
    mfaRecipientDestination:
      type: object
      properties:
        destination:
          type: string
          description: Destination of a Mfa request (e.g. the specific phone number).
        type:
          type: string
          description: The type of destination (e.g. SMS).
    createOrderResponse:
      type: object
      properties:
        paymentJourneyRedirectUrl:
          type:
          - string
          - 'null'
          description: The unique redirect url to provide to a buyer to pass them through the payments journey.
        paymentMethods:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/paymentOptions'
          description: The payment methods associated with the buyer.
        totalLimit:
          type:
          - integer
          - 'null'
          description: The total limit given to the buyer, if approved.
          format: int64
        availableLimit:
          type:
          - integer
          - 'null'
          description: The available limit remaining for the buyer.
          format: int64
    paymentData:
      required:
      - amount
      type:
      - object
      - 'null'
      properties:
        amount:
          type: integer
          description: Providers charge for the order, excluding fees, in their lowest denomination
          format: int64
        currency:
          enum:
          - GBP
          - EUR
          - USD
          type:
          - string
          - 'null'
          description: The ISO 4217 currency of the order
      description: Payment Details of the supplier providing the goods.
    address:
      type: object
      properties:
        addressLine1:
          type:
          - string
          - 'null'
          description: First line of the address.
        addressLine2:
          type:
          - string
          - 'null'
          description: Second line of the address.
        city:
          type:
          - string
          - 'null'
          description: Name of the city.
        region:
          type:
          - string
          - 'null'
          description: Name of the Region.
        postCode:
          type:
          - string
          - 'null'
          description: Postcode.
        country:
          type:
          - string
          - 'null'
          description: Country.
      description: Director residential address.
    paymentJourney:
      required:
      - paymentAcceptedRedirectUrl
      - paymentDeclinedRedirectUrl
      type:
      - object
      - 'null'
      properties:
        paymentAcceptedRedirectUrl:
          type: string
          description: Link user is redirected to after completing payment journey.
        paymentDeclinedRedirectUrl:
          type: string
          description: Link user is redirected to after declining payment journey.
        paymentCancelledRedirectUrl:
          type:
          - string
          - 'null'
          description: Link user is redirected to after cancelling payment journey.
        declineStatus:
          enum:
          - Started
          - Completed
          - Expired
          - Ineligible
          - InReview
          - InsufficientFunds
          - Eligible
          - UnverifiedSoleTrader
          - EligibilityCheckIsRequired
          - OnboardingIsRequired
          - MfaSessionInProgress
          - MfaSessionExpired
          - MfaSessionRejected
          - MfaNotSupported
          - MfaSessionApproved
          - InsufficientFundsOther
          - InsufficientFundsOnboardingChecksAreRequired
          - OnboardingChecksAreRequired
          - OnboardingChecksAreFailed
          - Blocked
          type: string
          description: Status describing the reason for declined order
        autoTransitionOnCompletion:
          enum:
          - Draft
          - AwaitingPrepayment
          - Submitted
          - ReadyToAdvance
          - Advanced
          - Repaid
          - Overdue
          - Closed
          - Cancelled
          type: string
          description: 'Defines an order status that will be set after payment journey is completed. Can have one of the following values: Submitted or ReadyToAdvance'
      description: Payment journey details for if you're choosing to use our hosted web app.
    getManyOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/baseOrder'
          description: Collection of orders that fits the search criteria.
        totalCount:
          type: integer
          description: The total number of orders that fits the search criteria.
          format: int32
        pageSize:
          type: integer
          description: Number of order fitting each page.
          format: int32
    directorDetails:
      type:
      - object
      - 'null'
      properties:
        fullName:
          type:
          - string
          - 'null'
          description: First and Last Name of the director.
          deprecated: true
        firstName:
          type:
          - string
          - 'null'
          description: First name of the director.
        lastName:
          type:
          - string
          - 'null'
          description: Last name of the director.
        phoneNumber:
          type:
          - string
          - 'null'
          description: Director phone number.
        dateOfBirth:
          type:
          - string
          - 'null'
          description: Director date of birth.
          format: date-time
        residentialAddress:
          $ref: '#/components/schemas/address'
      description: Company director details.
    orderPaymentInfo:
      type:
      - object
      - 'null'
      properties:
        supplier:
          $ref: '#/components/schemas/paymentData'
        merchant:
          $ref: '#/components/schemas/paymentData'
        prepayment:
          $ref: '#/components/schemas/paymentData'
        paymentMethod:
          type:
          - string
          - 'null'
          description: The payment method to be used for the order.
      description: The details of the payments, including the type of payment terms and the gross amount.
    repaymentData:
      required:
      - repaymentDate
      - repaymentAmount
      type:
      - object
      - 'null'
      properties:
        repaymentDate:
          type: string
          description: Repayment date for the order
          format: date-time
        repaymentAmount:
          $ref: '#/components/schemas/repaymentMonetaryValue'
      description: The repayment details if the order is transitioned to repaid status
    repaymentMonetaryValue:
      required:
      - amount
      - currency
      type: object
      properties:
        amount:
          type: integer
          description: Providers repaid amount for the order, in their lowest denomination
          format: int64
        currency:
          enum:
          - GBP
          - EUR
          - USD
          type: string
          description: The ISO 4217 currency of the order
      description: Repayment amount and currency for the order
    buyerDetails:
      type:
      - object
      - 'null'
      properties:
        companyRegistrationNumber:
