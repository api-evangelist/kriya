note: >-
  Kriya publishes no hosted or remote MCP server. Searches of docs.kriya.co,
  www.kriya.co and the npm registry found no first-party MCP package and no Kriya
  GitHub organisation. This is a CANDIDATE tool list derived one-to-one from the
  operationIds in the two published OpenAPI documents — a design starting point, not
  a Kriya claim.
server:
  name: kriya
  transport: http
  url: null
  published: false
authentication:
  type: apiKey
  header: X-Kriya-ApiKey
  detail: authentication/kriya-authentication.yml
  note: >-
    A partner API key is required. Test and Production keys differ; an MCP
    deployment should bind one environment explicitly.
safety_notes:
  - >-
    TransitionOrderStatus moves real money — ReadyToAdvance triggers Kriya to advance
    funds to the Merchant and Supplier and cannot be reversed or cancelled. Any agent
    exposure should require human confirmation.
  - >-
    The three Scenario tools exist only in the Test environment and must never be
    wired against Production.
  - >-
    CompaniesSearch is rate-limited to 5 requests per second, far tighter than the
    2000-per-5-minutes API default.
